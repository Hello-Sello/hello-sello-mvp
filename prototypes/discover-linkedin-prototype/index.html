<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discover — LinkedIn redesign (DISC-1, Variant D · polished)</title>
<!--
  THROWAWAY PROTOTYPE — DISC-1 (Discover Lane B), Variant D chosen.
  Polished pass: real Hello Sello shell + theme, mirrors real components
  (DiscoverDirectory rows + 4-state ConnectButton + type-pill/country facet bar +
  multi-tint Logo + VerifiedBadge tick, InboxRow, Avatar, BackButton).
  Design principles applied (research): rows=finite/act-now · cards=infinite/browse ·
  one loud CTA per zone · circle=person / rounded-square=company · 4/8 spacing rhythm ·
  section header = title+count+"See all" · verified ticks + mutual counts · <=6 facet pills.
  Layout D: Ads (leaderboard) -> [ Requests | My Network ] -> New People (cards) -> Companies (rows).
  Rules baked in: pharmacy hidden-but-searchable (companies AND people); everyone else visible.
  Not production.
-->
<style>
  :root{
    --brand:#e30b5d; --brand-soft:#ffb7d5; --brand-deep:#7a1638;
    --ink:#1f2020; --ink-muted:#6b6470;
    --success:#34b233; --info:#6c7bd9;
    --glass-bg:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.96);
    --glass-border:rgba(255,255,255,.65);
    --glass-shadow:0 10px 34px -12px rgba(122,18,48,.20);
    --font-sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.42;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(60rem 60rem at 10% -12%, rgba(255,183,213,.55), transparent 60%),
      radial-gradient(46rem 46rem at 108% 6%, rgba(227,11,93,.10), transparent 55%),
      linear-gradient(160deg,#ffffff 0%,#fff1f7 100%);
    background-attachment:fixed;}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--brand-soft)}
  .glass{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
  .glass-strong{background:var(--glass-strong);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}

  /* ===== app shell ===== */
  .app{display:flex;height:100vh;overflow:hidden}
  .rail{width:200px;flex:none;margin:12px 0 12px 12px;border-radius:24px;padding:12px;display:flex;flex-direction:column}
  .rail .top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;margin-bottom:12px}
  .rail .wordmark img{height:34px;width:auto;object-fit:contain}
  .rail .wordmark .txt{font-style:italic;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--brand)}
  .rail .collapse{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:rgba(31,32,32,.45);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .rail nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto;padding-right:2px}
  .navrow{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:16px;color:rgba(31,32,32,.55);font-size:14px;font-weight:500;transition:.18s}
  .navrow:hover{background:rgba(255,255,255,.55);color:var(--brand)}
  .navrow.active{background:rgba(255,183,213,.7);color:var(--brand);box-shadow:0 4px 14px -6px rgba(227,11,93,.45)}
  .navrow.active .bar{position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:28px;border-radius:0 4px 4px 0;background:var(--brand)}
  .navrow.soon{color:rgba(31,32,32,.30);cursor:not-allowed}
  .navrow .chev{margin-left:auto;color:rgba(31,32,32,.4)}
  .navrow svg{flex:none}
  .acct{margin-top:12px;border-top:1px solid rgba(0,0,0,.05);padding-top:12px}
  .acct .card{display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px 8px 6px;border-radius:16px;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.5)}
  .acct .card:hover{background:#fff;border-color:var(--brand-soft)}
  .acct .nm{min-width:0;flex:1;text-align:left;line-height:1.2}
  .acct .nm b{display:block;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct .nm span{display:block;font-size:11.5px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .colmain{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:48px;margin:12px 12px 0;border-radius:16px;padding:0 12px;display:flex;align-items:center;gap:16px;flex:none;z-index:10}
  .topbar .search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);border-radius:12px;padding:8px 16px;font-size:13.5px;color:rgba(31,32,32,.45);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .topbar .right{display:flex;align-items:center;gap:10px}
  .topbar .iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:rgba(31,32,32,.45);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .topbar .iconbtn:hover{background:rgba(255,255,255,.7);color:var(--brand)}
  .topbar .co{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);border-radius:12px;padding:4px 14px 4px 4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .topbar .co .lg{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:700;font-size:12px}
  .topbar .co b{font-size:13.5px;font-weight:600}
  .scroll{flex:1;overflow:auto;padding:16px 12px 60px}
  .wrap{max-width:1080px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:22px}

  /* ===== section ===== */
  .section{border-radius:20px;overflow:hidden}
  .sec-h{display:flex;align-items:baseline;gap:10px;padding:16px 18px 10px}
  .sec-h h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px}
  .sec-h .count{font-size:13px;color:var(--ink-muted);font-weight:500}
  .sec-h .seeall{margin-left:auto;color:var(--brand);font-weight:600;font-size:13px;align-self:center}
  .sec-h .seeall:hover{color:var(--brand-deep)}
  .sec-b{padding:2px 18px 16px}

  /* ===== buttons (mirror ConnectButton family) ===== */
  .btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px;transition:.14s}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(227,11,93,.3);background-image:linear-gradient(180deg,rgba(255,255,255,.18),transparent 60%)}
  .btn-primary:hover{background:var(--brand-deep)}
  .btn-outline{color:var(--brand-deep);box-shadow:inset 0 0 0 1.4px var(--brand)}
  .btn-outline:hover{background:rgba(255,183,213,.28)}
  .btn-ghost{color:var(--ink-muted);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .btn-ghost:hover{background:rgba(0,0,0,.04)}
  .btn-sm{padding:6px 13px;font-size:12.5px}
  .btn[disabled]{opacity:.6;cursor:default}
  .pill-static{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700}
  .pill-success{background:rgba(52,178,51,.15);color:var(--success)}
  .pill-incoming{background:rgba(255,183,213,.6);color:var(--brand-deep)}

  /* logo (company) = rounded-square + verified tick ; avatar (person) = circle */
  .logo{position:relative;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);overflow:visible}
  .logo .tick{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--success);border:2px solid #fff;display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px -1px rgba(52,178,51,.6)}
  .avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}

  /* ===== ads leaderboard ===== */
  .adwrap{position:relative;border-radius:20px;overflow:hidden}
  .adtag{position:absolute;top:9px;right:12px;z-index:3;font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.85);background:rgba(0,0,0,.22);padding:2px 8px;border-radius:20px;backdrop-filter:blur(4px)}
  .adslide{display:none;height:112px;align-items:center;gap:22px;padding:0 26px;position:relative}
  .adslide.on{display:flex}
  .adslide .cta{margin-left:auto;flex:none}
  .ad-btn{background:#fff;color:#111;font-weight:800;font-size:14px;padding:12px 22px;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .ad-sanraf{background:#e8492e}
  .ad-sanraf .brandbox{background:#fff;color:#1a3f8f;border:3px solid #1a3f8f;border-radius:10px;padding:6px 12px;font-weight:900;font-size:20px;flex:none;line-height:1;text-align:center}
  .ad-sanraf .brandbox small{display:block;font-size:9px;color:#1a3f8f;font-weight:700;letter-spacing:1.5px;margin-top:3px}
  .ad-sanraf .neu{color:#fff;font-size:13px;line-height:1.15;flex:none}
  .ad-sanraf .neu i{display:block;font-style:italic;font-weight:800;font-size:20px;font-family:Georgia,serif}
  .ad-sanraf .big{color:#fff;font-weight:900;font-size:30px;line-height:.95;letter-spacing:-.5px}
  .ad-sanraf .thc{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;color:#1a3f8f;display:grid;place-items:center;font-weight:900;font-size:17px;line-height:1;text-align:center}
  .ad-sanraf .thc small{display:block;font-size:8px;letter-spacing:1px}
  .ad-sanraf .ad-btn{color:#1a3f8f}
  .ad-aurora{background:linear-gradient(100deg,#155e42,#2f9e6e)}
  .ad-aurora .big{color:#fff;font-weight:800;font-size:24px;letter-spacing:-.3px}
  .ad-aurora .sub{color:rgba(255,255,255,.92);font-size:14px}
  .ad-aurora .lg2{width:52px;height:52px;border-radius:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
  .ad-aurora .ad-btn{color:#155e42}
  .addots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:6px}
  .addots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:.15s}
  .addots i.on{background:#fff;width:18px;border-radius:20px}

  /* ===== duo (Requests | My Network) — defined height, expand-within ===== */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch}
  .duo .section{display:flex;flex-direction:column;height:312px}
  .duo .sec-b{flex:1;min-height:0;overflow-y:auto}
  @media(max-width:860px){.duo{grid-template-columns:1fr}.duo .section{height:auto;max-height:360px}}

  /* request row (LinkedIn invitations band) */
  .req{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid rgba(0,0,0,.05)}
  .req:first-child{border-top:none}
  .req .who{min-width:0;flex:1}
  .req .who b{font-weight:700}
  .req .who .note{color:var(--ink-muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .req .who .mutual{color:rgba(31,32,32,.4);font-size:11.5px;margin-top:3px;display:flex;align-items:center;gap:4px}
  .req .acts{display:flex;gap:8px;flex:none}
  .req.done{opacity:.5}

  /* network row */
  .net{border-top:1px solid rgba(0,0,0,.05)}
  .net:first-child{border-top:none}
  .net .row{display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer}
  .net .meta{flex:1;min-width:0}
  .net .nm{font-weight:700}
  .net .sub{color:var(--ink-muted);font-size:12px;margin-top:2px}
  .net .chev{color:rgba(31,32,32,.4);transition:.15s}
  .net.open .chev{transform:rotate(180deg)}
  .net .people{display:none;padding:0 0 12px 56px;gap:9px;flex-direction:column}
  .net.open .people{display:flex}
  .net .person{display:flex;align-items:center;gap:9px}
  .net .person .pn{font-weight:600;font-size:12.5px}
  .net .person .pr{color:var(--ink-muted);font-size:11.5px}

  /* ===== new people cards ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding-top:6px}
  .pcard{position:relative;border:1px solid rgba(0,0,0,.07);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:rgba(255,255,255,.55);transition:.14s}
  .pcard:hover{box-shadow:var(--glass-shadow);transform:translateY(-2px);background:#fff}
  .pcard .cover{height:56px}
  .pcard .dismiss{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.9);background:rgba(0,0,0,.18);opacity:0;transition:.14s;z-index:2}
  .pcard:hover .dismiss{opacity:1}
  .pcard .dismiss:hover{background:rgba(0,0,0,.35)}
  .pcard .b{padding:0 14px 16px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center}
  .pcard .av{margin:-36px 0 0;border:3px solid #fff;box-shadow:0 2px 8px -2px rgba(0,0,0,.25)}
  .pcard .pn{font-weight:700;font-size:15px;margin-top:9px;line-height:1.2}
  .pcard .pt{color:var(--ink-muted);font-size:12.5px;margin-top:3px;line-height:1.32;min-height:32px}
  .pcard .mutual{color:rgba(31,32,32,.42);font-size:11.5px;margin-top:7px;display:flex;align-items:center;gap:4px}
  .pcard .btn{margin-top:auto;width:100%;justify-content:center;margin-top:12px}

  /* ===== companies ===== */
  .csearch{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.7);border-radius:999px;padding:9px 16px;margin:2px 0 14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);color:rgba(31,32,32,.5)}
  .csearch input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink)}
  .facets{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
  .facets .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);margin-right:2px}
  .dd{position:relative}
  .ftrig{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-muted);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:.14s}
  .ftrig:hover{background:#fff}
  .ftrig.on{background:var(--brand);color:#fff;box-shadow:none}
  .ddpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:252px;border-radius:16px;padding:8px;max-height:288px;overflow:auto}
  .ddopt{display:flex;align-items:center;gap:11px;width:100%;padding:8px;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink);text-align:left}
  .ddopt:hover{background:rgba(255,183,213,.22)}
  .cbox{flex:none;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
  .cbox.on{background:var(--brand);box-shadow:none}
  .ddclear{width:100%;text-align:left;padding:8px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--brand)}
  .ddclear:hover{background:rgba(255,183,213,.22)}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:10px 0 2px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--brand);color:#fff}
  .chip span{display:inline-flex;cursor:pointer;opacity:.85}
  .chip span:hover{opacity:1}
  .countline{font-size:13px;margin:12px 2px 8px}
  .countline b{color:var(--ink)}
  .countline span{color:var(--ink-muted)}
  .crow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;border-radius:16px;padding:13px 16px;transition:.14s;margin-bottom:10px}
  .crow:hover{background:rgba(255,255,255,.8)}
  .crow .meta{min-width:0}
  .crow .cn{display:flex;align-items:center;gap:8px}
  .crow .cn b{font-weight:700}
  .crow .cn b:hover{text-decoration:underline;cursor:pointer}
  .crow .loc{color:var(--ink-muted);font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .tag{border-radius:999px;background:rgba(255,255,255,.7);padding:2px 10px;font-size:11.5px;font-weight:600;color:var(--ink-muted);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .crow.hidden-co{opacity:.72}
  .badge-search{border-radius:999px;background:rgba(255,183,213,.4);color:var(--brand-deep);font-size:10px;font-weight:700;padding:2px 8px;box-shadow:inset 0 0 0 1px var(--brand-soft)}
  .note-line{color:var(--ink-muted);font-size:12px;padding:6px 2px 0;font-style:italic}
</style>
</head>
<body>
<div class="app">
  <aside class="rail glass">
    <div class="top">
      <span class="wordmark"><img src="../../public/hello-sello-logo.png" alt="Hello Sello" onerror="this.outerHTML='<span class=&quot;txt&quot;>Hello Sello</span>'"/></span>
      <span class="collapse" id="ic-collapse"></span>
    </div>
    <nav id="nav"></nav>
    <div class="acct"><button class="card"><span class="avatar" style="width:38px;height:38px;background:#6c7bd9;font-size:14px">MV</span><span class="nm"><b>Muskan Verma</b><span>Nordwind Distribution</span></span><span id="ic-acctchev" style="color:rgba(31,32,32,.4)"></span></button></div>
  </aside>

  <div class="colmain">
    <header class="topbar glass-strong">
      <div class="search"><span id="ic-search"></span> Search for company, product or service...</div>
      <div class="right">
        <button class="iconbtn" id="ic-bell"></button>
        <button class="iconbtn" id="ic-bag"></button>
        <div class="co"><span class="lg">ND</span><b>Nordwind Distribution</b></div>
      </div>
    </header>
    <div class="scroll"><div class="wrap" id="content"></div></div>
  </div>
</div>

<script>
/* ---- icons (lucide-style) ---- */
const P={
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  connect:'<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
  store:'<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M2 7h20"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.6 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  tag:'<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r=".9"/>',
  trade:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  panel:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>', chevD:'<path d="m6 9 6 6 6-6"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', arrowR:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  slider:'<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>',
};
const ic=(n,s=20,sw=1.75)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ---- nav (surfaces.ts) ---- */
const SURFACES=[
  {label:"Home",icon:"home",state:"active"},
  {label:"Connect",icon:"connect",state:"active",accordion:true},
  {label:"Discover",icon:"compass",state:"active",active:true},
  {label:"Present",icon:"store",state:"active"},
  {label:"Buy",icon:"cart",state:"soon"},
  {label:"Allocate",icon:"tag",state:"active"},
  {label:"Trade",icon:"trade",state:"soon"},
];
function renderNav(){
  document.getElementById('nav').innerHTML=SURFACES.map(s=>{
    const cls=`navrow ${s.active?'active':''} ${s.state==='soon'?'soon':''}`;
    const chev=s.accordion?`<span class="chev">${ic('chevD',16,2)}</span>`:'';
    return `<div class="${cls}">${s.active?'<span class="bar"></span>':''}${ic(s.icon,20,s.active?2.1:1.75)}<span>${s.label}</span>${chev}</div>`;
  }).join('');
  document.getElementById('ic-collapse').innerHTML=ic('panel',18);
  document.getElementById('ic-acctchev').innerHTML=ic('chevR',16,2);
  document.getElementById('ic-search').innerHTML=ic('search',16);
  document.getElementById('ic-bell').innerHTML=ic('bell',18);
  document.getElementById('ic-bag').innerHTML=ic('bag',18);
}

/* ---- tint palette (real DiscoverDirectory TINTS) ---- */
const TINTS=["#34b233","#6c7bd9","#e30b5d","#f59e0b","#0ea5e9","#8b5cf6","#ef4444","#14b8a6","#ec4899","#22c55e","#a855f7","#64748b"];
const tintFor=(s)=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return TINTS[h%TINTS.length];};
const initials=(n)=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
// company logo = rounded-square + verified tick
const logo=(name,size,verified=true)=>`<span class="logo" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.34)}px;background:linear-gradient(140deg,rgba(255,255,255,.28),transparent 55%),${tintFor(name)}">${initials(name)}${verified?`<span class="tick">${ic('check',10,3.2)}</span>`:''}</span>`;
// person avatar = circle (tint simulates a profile photo)
const avatar=(name,size,cls="avatar",style="")=>`<span class="${cls}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px;background:linear-gradient(140deg,rgba(255,255,255,.25),transparent 55%),${tintFor(name)};${style}">${initials(name)}</span>`;

/* ---- data ---- */
const requests=[
  {name:"GreenLeaf Wholesale",note:"We'd love to supply your network with EU-GMP flower.",when:"2d",mutual:4},
  {name:"Nordic Import Co",note:"Interested in connecting on your Q3 import needs.",when:"5d",mutual:2},
  {name:"BioMed Extracts",note:"Reaching out about CO₂ extract supply for pharmacies.",when:"1w",mutual:1},
  {name:"Alpine Cultivation",note:"Would like to connect — GACP flower, EU-wide.",when:"1w",mutual:3},
];
const network=[
  {name:"Highland GACP Farms",city:"Inverness, UK",contacts:2,deals:1,people:[{name:"James Bell",role:"Cultivation Lead"},{name:"Fiona Muir",role:"Operations"}]},
  {name:"Aurora Botanics",city:"Amsterdam, NL",contacts:3,deals:2,people:[{name:"Marco Rossi",role:"Sales Director"},{name:"Sanne de Vries",role:"Logistics"},{name:"Tom Bakker",role:"QA"}]},
  {name:"Nordic Import Co",city:"Copenhagen, DK",contacts:1,deals:0,people:[{name:"Sofie Jensen",role:"Import Manager"}]},
  {name:"Rhein Valley Extracts",city:"Cologne, DE",contacts:2,deals:1,people:[{name:"Klara Novak",role:"Account Manager"},{name:"Jonas Hoffmann",role:"QA"}]},
];
const people=[
  {name:"Lena Fischer",title:"Head of Procurement",company:"GreenLeaf Wholesale",mutual:4},
  {name:"Marco Rossi",title:"Sales Director",company:"Aurora Botanics",mutual:6},
  {name:"Sofie Jensen",title:"Import Manager",company:"Nordic Import Co",mutual:1},
  {name:"James Bell",title:"Cultivation Lead",company:"Highland GACP Farms",mutual:3},
  {name:"Anna Weber",title:"QA & Compliance Lead",company:"PharmaCanna Mfg",mutual:2},
  {name:"Liam O'Connor",title:"Business Development",company:"Tasman TGA Growers",mutual:0},
  {name:"Klara Novak",title:"Account Manager",company:"Rhein Valley Extracts",mutual:2},
  {name:"Erik Lindqvist",title:"Head of Sales",company:"Nordic Import Co",mutual:5},
];
const companies=[
  {name:"Aurora Botanics",cat:"EU-GMP Cultivator",group:"Cultivator",country:"Netherlands",city:"Amsterdam",state:"none",mutual:5},
  {name:"GreenLeaf Wholesale",cat:"Wholesaler",group:"Wholesaler",country:"Germany",city:"Berlin",state:"incoming",mutual:4},
  {name:"Nordic Import Co",cat:"Importer",group:"Importer",country:"Denmark",city:"Copenhagen",state:"requested",mutual:2},
  {name:"Highland GACP Farms",cat:"GACP Cultivator",group:"Cultivator",country:"United Kingdom",city:"Inverness",state:"connected",mutual:3},
  {name:"PharmaCanna Mfg",cat:"Manufacturer Pharma",group:"Manufacturer",country:"Switzerland",city:"Basel",state:"none",mutual:1},
  {name:"Tasman TGA Growers",cat:"TGA-GMP Cultivator",group:"Cultivator",country:"Australia",city:"Hobart",state:"none",mutual:0},
  {name:"Rhein Valley Extracts",cat:"Other",group:"Other",country:"Germany",city:"Cologne",state:"none",mutual:2},
  {name:"Berlin Mitte Apotheke",cat:"Pharmacy",group:"Pharmacy",country:"Germany",city:"Berlin",state:"none",hidden:true},
];
// Company type + Country are DROPDOWN multi-select filters — scale to ANY platform tag.
const TYPE_OPTS=["GACP Cultivator","EU-GMP Cultivator","TGA-GMP Cultivator","Wholesaler","Importer","Manufacturer Pharma","Other"];
const COUNTRY_OPTS=["Australia","Denmark","Germany","Netherlands","Switzerland","United Kingdom"];
const cState={q:"",types:new Set(),countries:new Set(),dd:null};

/* ---- section header ---- */
const header=(title,count,seeall=true)=>`<div class="sec-h"><h2>${title}</h2><span class="count">${count}</span>${seeall?'<a class="seeall">See all</a>':''}</div>`;

/* ---- ads ---- */
function adsSection(){
  return `<section class="section glass-strong"><div class="adwrap">
    <span class="adtag">Sponsored</span>
    <div class="adslide ad-sanraf on" data-ad="0">
      <div class="brandbox">SAN RAF<small>®</small></div>
      <div class="neu">NEU IN<i>Deutschland</i></div>
      <div class="thc">31%<small>THC</small></div>
      <div class="big">CAMPFIRE<br>KUSH</div>
      <div class="cta"><button class="ad-btn">Jetzt entdecken</button></div>
    </div>
    <div class="adslide ad-aurora" data-ad="1">
      <div class="lg2">AB</div>
      <div><div class="big">Aurora Botanics — new EU-GMP harvest</div><div class="sub">Now live in Germany · request catalogue access</div></div>
      <div class="cta"><button class="ad-btn">Mehr erfahren</button></div>
    </div>
    <div class="addots"><i class="on" onclick="showAd(0,this)"></i><i onclick="showAd(1,this)"></i></div>
  </div></section>`;
}
function showAd(n,dot){document.querySelectorAll('.adslide').forEach(s=>s.classList.toggle('on',+s.dataset.ad===n));dot.parentNode.querySelectorAll('i').forEach(d=>d.classList.remove('on'));dot.classList.add('on');}

/* ---- requests (rows, finite; the only FILLED primary = Accept) ---- */
function requestsSection(){
  const rows=requests.map((r,i)=>`
    <div class="req" data-req="${i}">
      ${avatar(r.name,44)}
      <div class="who">
        <b>${r.name}</b>
        <div class="note">${r.note}</div>
        ${r.mutual?`<div class="mutual">${ic('users',12,1.75)} ${r.mutual} mutual</div>`:''}
      </div>
      <div class="acts">
        <button class="btn btn-ghost btn-sm" onclick="req(${i},0,this)">Ignore</button>
        <button class="btn btn-primary btn-sm" onclick="req(${i},1,this)">Accept</button>
      </div>
    </div>`).join("");
  return `<section class="section glass-strong">${header("Connection requests",requests.length)}<div class="sec-b">${rows}</div></section>`;
}
function req(i,ok,btn){const row=btn.closest('.req');row.classList.add('done');row.querySelector('.acts').innerHTML=`<span style="font-size:12.5px;color:var(--ink-muted);font-weight:600">${ok?'✓ Connected':'Ignored'}</span>`;}

/* ---- my network (rows, expandable) ---- */
function networkSection(){
  const rows=network.map(n=>`
    <div class="net">
      <div class="row" onclick="this.parentNode.classList.toggle('open')">
        ${logo(n.name,44)}
        <div class="meta"><div class="nm">${n.name}</div><div class="sub">${n.city} · ${n.contacts} contacts · ${n.deals} open ${n.deals===1?'deal':'deals'}</div></div>
        <span class="chev">${ic('chevD',16,2)}</span>
      </div>
      <div class="people">${n.people.map(p=>`<div class="person">${avatar(p.name,28)}<div><span class="pn">${p.name}</span> · <span class="pr">${p.role}</span></div></div>`).join("")}</div>
    </div>`).join("");
  return `<section class="section glass-strong">${header("My network",network.length)}<div class="sec-b">${rows}</div></section>`;
}

/* ---- new people (cards, browse; OUTLINED Connect + dismiss) ---- */
function peopleSection(){
  const cards=people.map((p,i)=>`
    <div class="pcard">
      <button class="dismiss" onclick="this.closest('.pcard').style.display='none'">${ic('x',13,2.2)}</button>
      <div class="cover" style="background:linear-gradient(120deg,${tintFor(p.company)}22,${tintFor(p.name)}33)"></div>
      <div class="b">
        ${avatar(p.name,72,"avatar av")}
        <div class="pn">${p.name}</div>
        <div class="pt">${p.title} · ${p.company}</div>
        ${p.mutual?`<div class="mutual">${ic('users',12,1.75)} ${p.mutual} mutual</div>`:'<div class="mutual" style="opacity:.5">New to Hello Sello</div>'}
        <button class="btn btn-outline btn-sm" onclick="this.outerHTML='<button class=&quot;btn btn-ghost btn-sm&quot; disabled style=&quot;margin-top:12px;width:100%;justify-content:center&quot;>✓ Pending</button>'">${ic('plus',14,2.4)} Connect</button>
      </div>
    </div>`).join("");
  return `<section class="section glass-strong">${header("People you may know",people.length)}<div class="sec-b"><div class="grid">${cards}</div></div></section>`;
}

/* ---- companies (dropdown filters + rows) ---- */
function companiesSection(){
  return `<section class="section glass-strong">${header("Companies","",false)}
    <div class="sec-b">
      <div class="csearch">${ic('search',16)}<input placeholder="Search companies by name…" oninput="cState.q=this.value;refreshCompanies()"/></div>
      <div class="facets" id="facets"></div>
      <div id="chips"></div>
      <div class="countline" id="countline"></div>
      <div id="crows"></div>
      <div class="note-line">Pharmacies stay hidden from the list — reachable only by name search (shown dimmed here when searched, to demo the rule). Same gate applies to people.</div>
    </div>
  </section>`;
}
function ddMarkup(id,label,opts,sel,withIcon){
  const txt=sel.size===0?label:`${sel.size} selected`;
  const panel=cState.dd===id
    ? `<div class="ddpanel glass-strong">${opts.map(o=>`<button class="ddopt" onclick="toggleOpt('${id}','${o}');event.stopPropagation()"><span class="cbox ${sel.has(o)?'on':''}">${sel.has(o)?ic('check',12,3):''}</span>${o}</button>`).join('')}${sel.size?`<button class="ddclear" onclick="clearSel('${id}');event.stopPropagation()">Clear ${sel.size} selected</button>`:''}</div>`
    : '';
  return `<div class="dd"><button class="ftrig ${sel.size?'on':''}" onclick="toggleDD('${id}');event.stopPropagation()">${withIcon?ic('pin',15,1.9):''}${txt} ${ic('chevD',15,2)}</button>${panel}</div>`;
}
function companyRow(c){
  let cta;
  if(c.state==="connected") cta=`<span class="pill-static pill-success">${ic('check',15,2.4)} Connected</span>`;
  else if(c.state==="incoming") cta=`<span class="pill-static pill-incoming">Wants to connect ${ic('arrowR',14,2.2)}</span>`;
  else if(c.state==="requested") cta=`<span class="pill-static pill-success">${ic('check',15,2.4)} Requested</span>`;
  else cta=`<button class="btn btn-primary btn-sm" onclick="this.outerHTML='<span class=&quot;pill-static pill-success&quot;>Requested</span>'">Connect ${ic('arrowR',15,2.2)}</button>`;
  const badge=c.hidden?`<span class="badge-search">Found by search · not listed</span>`:"";
  const mutual=c.mutual?`<span>${ic('users',13,1.75)} ${c.mutual} mutual</span>`:"";
  return `<div class="crow ${c.hidden?'hidden-co':''}">${logo(c.name,48)}<div class="meta"><div class="cn"><b>${c.name}</b>${badge}</div><div class="loc">${ic('pin',13,1.75)} ${c.city}, ${c.country} <span class="tag">${c.cat}</span> ${mutual}</div></div>${cta}</div>`;
}
function refreshCompanies(){
  document.getElementById('facets').innerHTML=
    `<span class="lbl">Filter</span>`+ddMarkup('types','Company type',TYPE_OPTS,cState.types,false)+ddMarkup('countries','Country',COUNTRY_OPTS,cState.countries,true);
  const chips=[...[...cState.types].map(t=>['types',t]),...[...cState.countries].map(c=>['countries',c])];
  document.getElementById('chips').innerHTML=chips.length
    ? `<div class="chips">${chips.map(([g,v])=>`<span class="chip">${v} <span onclick="toggleOpt('${g}','${v}')">${ic('x',12,2.4)}</span></span>`).join('')}<button class="ddclear" style="width:auto;padding:5px 9px" onclick="cState.types.clear();cState.countries.clear();refreshCompanies()">Clear all</button></div>`
    : '';
  const q=cState.q.trim().toLowerCase();
  const match=c=>{
    if(c.hidden) return q!=="" && c.name.toLowerCase().includes(q);
    if(q && !c.name.toLowerCase().includes(q)) return false;
    if(cState.types.size && !cState.types.has(c.cat)) return false;
    if(cState.countries.size && !cState.countries.has(c.country)) return false;
    return true;
  };
  const list=companies.filter(match);
  document.getElementById('countline').innerHTML=`<b>${list.length}</b> <span>${list.length===1?'company':'companies'}</span>`;
  document.getElementById('crows').innerHTML=list.length
    ? list.map(companyRow).join('')
    : `<p style="padding:22px;text-align:center;color:var(--ink-muted);font-size:13px">No companies match your filters.</p>`;
}
function toggleDD(id){cState.dd=cState.dd===id?null:id;refreshCompanies();}
function toggleOpt(id,v){const s=cState[id];s.has(v)?s.delete(v):s.add(v);refreshCompanies();}
function clearSel(id){cState[id].clear();refreshCompanies();}
document.addEventListener('click',e=>{if(cState.dd && !e.target.closest('.dd')){cState.dd=null;refreshCompanies();}});

/* ---- render Variant D ---- */
document.getElementById('content').innerHTML=
  adsSection()+
  `<div class="duo">${requestsSection()}${networkSection()}</div>`+
  peopleSection()+
  companiesSection();
renderNav();
refreshCompanies();
</script>
</body>
</html>
