<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat + Flip Deal Document — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<!--
  PROTOTYPE — THROWAWAY. Not production.
  Question: chat redesign — no separate Deal Room page, no Sella rail.
  CHOSEN (2026-07-03): variant A — chat + toggleable side panel. The paper's
  FLIP side = Signals | Logs only (no chat on the back; the deal group chat
  is a normal conversation in the left list). Proposed changes render as a
  red/green diff ON the card with Change / Approve.
  UPDATE (2026-07-06): card = 8 parts (toolbar / letterhead / parties /
  products / extra conditions / open items / notes / decision). ✎ = edit mode:
  products row-edit (size dropdown, units stepper, price input, 🗑, add from
  shop), extra conditions seller-only (payment, expiry, delivery, discounts,
  bundle deals), one note per party. Signing is two-sided: seller signs →
  invoice → buyer signs after delivery → closed → re-open ticket (LATER).
  UPDATE (2026-07-06b): Seller/Buyer VIEW switch in the demo bar (no names —
  the roles must read clearly). Buyer: edits product size/units, NEVER price
  (lock icon); extra conditions read-only; edits only their own note; gets the
  bundle "take the deal" button; signs after the invoice. Deal creation itself
  is seller-only (rule noted, no create flow in this prototype). Bundle deals
  are structured rules the seller builds in a BI-style if-then table:
  product · (quantity g | units | price) ⋚ value → free delivery / discount.
-->
<style>
  /* ============================================================
     SECTION A — SHARED DESIGN SYSTEM (from dealcard-v3-prototype)
     ============================================================ */
  :root {
    --maroon: #76002d;
    --brand: #ec4899;   /* pink-500 — system */
    --brand-2: #db2777; /* pink-600 — system primary */
    --brand-soft: #f9a8d4; /* pink-300 */
    --brand-tint: #fce7f3; /* pink-100 */
    --ink: #0f172a;     /* slate-900 */
    --ash: #64748b;     /* slate-500 */
    --line: #e2e8f0;    /* slate-200 */
    --bg: #fdf7fa;
    --white: #ffffff;
    --ok: #16924a;
    --ok-tint: #e8f6ee;
    --warn: #b45309;
    --warn-tint: #fdf1e3;
    --danger: #b3203f;
    --danger-tint: #fdecef;
    --link: #4a5de8;
    --paper: #fdfcfa;
    --paper-shadow: 0 14px 40px rgba(118, 0, 45, .16), 0 2px 8px rgba(31, 20, 48, .08);
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --r-xs: 8px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .disp { font-family: "Space Grotesk", ui-sans-serif, sans-serif; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font: inherit; }

  /* ============================================================
     SECTION B — APP SHELL (rail + chat list + stage)
     ============================================================ */
  .app { display: flex; height: 100vh; }

  .rail {
    width: 64px; flex: none; display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 14px 0; background: #fff; border-right: 1px solid var(--line);
  }
  .rail .logo { font-weight: 800; color: var(--brand-2); font-size: 11px; letter-spacing: .5px; margin-bottom: 8px; }
  .rail .ric {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    color: var(--ash);
  }
  .rail .ric svg { width: 20px; height: 20px; }
  .rail .ric.active { background: var(--brand-tint); color: var(--brand-2); }
  .convo .av svg, .minav svg, .chathead .av svg { width: 18px; height: 18px; color: var(--maroon); }
  .dealchip .doc svg { width: 14px; height: 14px; display: block; color: var(--brand-2); }
  .edit svg { width: 14px; height: 14px; display: block; }
  .ncmenu .mi svg { width: 16px; height: 16px; color: var(--brand-2); vertical-align: -3px; margin-right: 6px; }

  .chatlist {
    width: 292px; flex: none; background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-width: 0; position: relative;
    transition: width .18s ease;
  }
  .chatlist.min { width: 62px; }
  .lhead { display: flex; align-items: center; gap: 8px; margin: 14px 14px 8px; flex: none; }
  .lhead .newchat { flex: 1; margin: 0; }
  .collapsebtn {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff; color: var(--ash); font-size: 13px; font-weight: 700;
  }
  .collapsebtn:hover { background: var(--brand-tint); color: var(--brand-2); }
  .minlist { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; overflow-y: auto; flex: 1; }
  .minav {
    position: relative; width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: #efe7ee; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--maroon);
  }
  .minav.gav { font-size: 16px; background: #f3edf1; }
  .minav.act { outline: 2px solid var(--brand-2); outline-offset: 1px; }
  .minav .udot2 { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand-2); border: 2px solid #fff; }
  .chatlist .newchat {
    margin: 14px 14px 8px; background: var(--brand-2); color: #fff; border-radius: 999px;
    padding: 10px; font-weight: 700; text-align: center; font-size: 13px; cursor: pointer;
  }
  .ncmenu {
    position: absolute; top: 52px; left: 14px; right: 14px; z-index: 60;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 32px rgba(31,20,48,.16); padding: 6px;
  }
  .ncmenu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; }
  .ncmenu button b { display: block; font-size: 13px; }
  .ncmenu button span { color: var(--ash); font-size: 11.5px; }
  .ncmenu button:hover { background: var(--brand-tint); }
  .chatlist .search {
    margin: 4px 14px 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; color: var(--ash); font-size: 12.5px; flex: none;
  }
  .filters { display: flex; gap: 5px; padding: 0 14px 10px; flex: none; position: relative; }
  .fchip {
    border-radius: 999px; padding: 5px 11px; font-size: 11.5px; font-weight: 700;
    color: var(--ash); background: var(--bg); border: 1px solid var(--line);
  }
  .fchip.on { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
  .ddmenu {
    position: absolute; top: 32px; right: 10px; z-index: 60; min-width: 150px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(31,20,48,.16); padding: 5px;
  }
  .ddmenu button { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
  .ddmenu button:hover { background: var(--brand-tint); }
  .ddmenu button.on { color: var(--brand-2); }
  #convos { overflow-y: auto; flex: 1; }

  .convo { display: flex; gap: 10px; padding: 11px 14px; border-left: 3px solid transparent; cursor: default; }
  .convo.active { background: var(--brand-tint); border-left-color: var(--brand-2); }
  .convo .av {
    width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: #efe7ee; font-weight: 700; font-size: 12px; color: var(--maroon);
  }
  .convo .av.gav { font-size: 16px; background: #f3edf1; }
  .convo .cmeta { min-width: 0; flex: 1; }
  .convo .cnames { font-weight: 600; font-size: 12px; color: var(--ash); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convo .csubj { font-weight: 700; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 1px 0; }
  .convo .cprev { color: var(--ash); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convo.unread .cnames, .convo.unread .csubj { font-weight: 800; color: var(--ink); }
  .convo .cright { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .convo .ctime { color: var(--ash); font-size: 11px; }
  .convo.unread .ctime { color: var(--brand-2); font-weight: 700; }
  .convo .udot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-2); }

  #stage { flex: 1; min-width: 0; display: flex; }

  /* ============================================================
     SECTION C — CHAT COLUMN (P2P = white)
     ============================================================ */
  .chatcol { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; }
  .chathead {
    display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 64px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .chathead .av { width: 40px; height: 40px; border-radius: 50%; background: #efe7ee; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--maroon); position: relative; }
  .chathead .av::after { content: ""; position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid #fff; }
  .chathead .who .nm { font-weight: 700; font-size: 15px; }
  .chathead .who .co { color: var(--ash); font-size: 12px; }
  .chathead .spacer { flex: 1; }

  .dealchip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px;
    font-size: 12.5px; font-weight: 600; background: #fff;
    transition: box-shadow .15s;
  }
  .dealchip:hover { box-shadow: 0 2px 10px rgba(196, 21, 107, .18); }
  .dealchip .doc { font-size: 14px; }
  .dealchip .ver { background: var(--brand-tint); color: var(--brand-2); border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
  .dealchip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .dealchip .dot.pending { background: var(--warn); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .dealchip.on { background: var(--brand-tint); border-color: var(--brand-soft); }

  .msgs { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px; }
  .mrow { display: flex; flex-direction: column; max-width: 66%; }
  .mrow.in  { align-self: flex-start; align-items: flex-start; }
  .mrow.out { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 9px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; }
  .mrow.in  .bubble { background: #f4eff3; border-bottom-left-radius: 5px; }
  .mrow.out .bubble { background: var(--brand-2); color: #fff; border-bottom-right-radius: 5px; }
  .mmeta { color: var(--ash); font-size: 10.5px; margin: 3px 6px 8px; }

  .sysline { align-self: center; color: var(--ash); font-size: 11.5px; margin: 8px 0; }
  /* system message = neutral fact, center; clickable when it points at the diff */
  .syspill {
    align-self: center; text-align: center; max-width: 85%; margin: 8px 0;
    background: #f1f5f9; border: 1px solid var(--line); color: #475569;
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 5px 14px;
  }
  .syspill.click { cursor: pointer; background: var(--warn-tint); border-color: #f3ddbe; color: #92400e; }
  .syspill.click:hover { background: #fbe8cc; border-color: #eac989; }
  .syspill .dealnum { color: var(--link); text-decoration: underline; font-weight: 700; }

  .composer { flex: none; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  .composer .box {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px; background: #fff;
  }
  .composer input { flex: 1; border: none; outline: none; font-size: 13.5px; background: transparent; }
  .composer .send { color: var(--brand-2); font-weight: 800; font-size: 16px; }

  /* ============================================================
     SECTION D — THE PAPER (receipt-style deal document)
     ============================================================ */
  /* toolbar sits on the crimson mat, above the receipt */
  .dtoolbar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 26px; height: 64px; background: transparent;
  }
  .dtoolbar .tspace { flex: 1; }
  .tbtn {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; border-radius: 999px;
    background: rgba(255, 255, 255, .82);
    padding: 10px 18px; font-size: 13px; font-weight: 700; color: #26212e;
    box-shadow: 0 2px 10px rgba(180, 37, 99, .14);
  }
  .tbtn:hover { background: #fff; }
  .tbtn.icon { width: 40px; height: 40px; padding: 0; justify-content: center; }
  .tbtn svg { width: 15px; height: 15px; display: block; }
  .tbtn.on { background: var(--maroon); color: #fff; }
  .tbtn.on:hover { background: var(--maroon); filter: brightness(1.2); }
  .docscroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 26px 30px; }

  /* the receipt: real paper floating on the mat, scalloped torn edges top + bottom */
  .paperwrap { position: relative; width: 100%; margin: 0 auto; }
  .paper {
    position: relative;
    background: rgba(255, 255, 255, .58);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    color: #26212e;
    padding: 24px 42px 28px; animation: papein .28s ease;
    box-shadow: 0 16px 40px rgba(180, 37, 99, .2), 0 3px 10px rgba(180, 37, 99, .12);
  }
  @keyframes papein { from { opacity: 0; transform: translateY(6px) scale(.985); } }
  .paper::before, .paper::after {
    content: ""; position: absolute; left: 0; right: 0; height: 12px;
    background-size: 22px 12px; background-repeat: repeat-x;
  }
  .paper::before { top: -11px; background-image: radial-gradient(circle at 11px 12px, rgba(255,255,255,.58) 9.5px, transparent 10.5px); }
  .paper::after  { bottom: -11px; background-image: radial-gradient(circle at 11px 0px, rgba(255,255,255,.58) 9.5px, transparent 10.5px); }

  /* on-paper vocabulary: warm greys, hairline rules, letterpress small-caps labels */
  .plabel {
    font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
    color: #9c8494;
  }
  .lhead2 { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .wordmark { font-weight: 700; font-size: 19px; color: var(--maroon); }
  .docmeta { font-size: 11.5px; text-align: right; line-height: 1.55; color: #26212e; }
  .rule2 { border-top: 2.5px solid #26212e; border-bottom: 1px solid #26212e; height: 4px; margin-top: 10px; }

  /* parties = one line: SELLER x · You ────→ BUYER y (per mockup 2026-07-06) */
  .parties {
    display: flex; align-items: baseline; gap: 10px;
    padding: 18px 0 16px; border-bottom: 1px solid rgba(130, 40, 80, .18);
  }
  .parties .pco2 { font-weight: 700; font-size: 15px; }
  .parties .you { color: var(--brand-2); font-size: 12px; font-weight: 700; }
  .parties .arrow { flex: 1; align-self: center; height: 1px; background: rgba(130, 40, 80, .4); position: relative; margin: 0 8px; }
  .parties .arrow::after { content: ""; position: absolute; right: 0; top: -3px; border: 3.5px solid transparent; border-left: 6px solid rgba(130, 40, 80, .55); border-right: none; }

  table.lines { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 16px; }
  table.lines th {
    text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.2px;
    color: #9c8494; font-weight: 700;
    border-bottom: 1.5px solid #26212e; padding: 0 8px 7px;
  }
  table.lines td { padding: 10px 8px; border-bottom: 1px solid rgba(130, 40, 80, .12); vertical-align: top; }
  table.lines td.num { text-align: right; white-space: nowrap; }
  tr.removed td { color: var(--danger); background: var(--danger-tint); text-decoration: line-through; }
  tr.added td   { color: var(--ok); background: var(--ok-tint); font-weight: 600; }
  tr.added td .newtag { display: inline-block; font-size: 9.5px; letter-spacing: .8px; background: var(--ok); color: #fff; border-radius: 999px; padding: 2px 9px; margin-top: 4px; text-decoration: none; }

  .totalrow {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 8px 16px; border-bottom: 1px solid rgba(130, 40, 80, .18);
  }
  .totalrow .plabel { margin-right: auto; }
  .totalrow b { font-size: 18px; }
  .totalrow b.up { font-size: 23px; color: var(--ok); }
  .totalrow .was { color: var(--danger); text-decoration: line-through; font-weight: 500; font-size: 13px; }
  .totalrow .delta { background: #edf3ee; border: 1px solid #cfe0d4; color: #26212e; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; }

  /* extra conditions = soft cards (seller-only editable; blank ones never shown) */
  .condwrap { border-bottom: 1px solid rgba(130, 40, 80, .18); }
  .condgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 0; }
  .condcard { background: rgba(255, 255, 255, .55); border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 6px rgba(180, 37, 99, .08); }
  .condcard .tval { font-size: 12.5px; font-weight: 600; margin-top: 5px; line-height: 1.5; }
  .condcard.wide { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .condcard.wide > div { min-width: 0; }
  .takebtn { margin-left: auto; flex: none; background: var(--brand-2); color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 12px; font-weight: 700; }
  .takebtn.taken { background: var(--ok); }
  .condedit { padding: 0 0 16px; }
  .condrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; flex-wrap: wrap; }
  .condcard select, .condcard input[type="date"], .condrow input, .condrow select {
    font: inherit; font-size: 12px; border: 1px solid #ecbcd2; border-radius: 8px;
    padding: 5px 8px; background: #fff; outline: none; max-width: 100%;
  }
  .condcard label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
  /* bundle rule builder — BI-style if-then table (seller only) */
  table.rulet { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  table.rulet th { text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #9c8494; font-weight: 700; padding: 4px 6px 5px; border-bottom: 1.5px solid rgba(130, 40, 80, .3); }
  table.rulet td { padding: 6px; border-bottom: 1px solid rgba(130, 40, 80, .12); }
  table.rulet select, table.rulet input { font: inherit; font-size: 12px; border: 1px solid #ecbcd2; border-radius: 8px; padding: 4px 6px; background: #fff; outline: none; max-width: 100%; }
  .locksm svg { width: 12px; height: 12px; vertical-align: -2px; color: #9c8494; }

  .items2 { padding: 16px 0 14px; border-bottom: 1px solid rgba(130, 40, 80, .18); }
  .items2 .cnt { display: inline-block; background: #f6d3e3; color: #b42563; border-radius: 999px; padding: 1px 8px; font-size: 10px; font-weight: 800; margin-left: 4px; }
  .item2 { display: flex; align-items: center; gap: 10px; padding: 9px 0 0; font-size: 13px; }
  .item2 .ttext { min-width: 0; }
  .item2 .asg {
    margin-left: auto; flex: none; background: #f6d3e3; color: #b42563;
    border-radius: 999px; padding: 3px 11px; font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .item2 .asg.me { background: var(--brand-2); color: #fff; }
  .item2.draft .asg { margin-left: 0; }
  .item2.priv { border: 1.5px dashed #d98ab1; border-radius: 12px; padding: 9px 12px; margin-top: 9px; }
  .cb2 {
    width: 20px; height: 20px; flex: none; cursor: pointer;
    border: 1.5px solid #d9b6c6; border-radius: 7px; background: rgba(255, 255, 255, .65);
    display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff;
  }
  .item2.done .cb2 { background: #35b45f; border-color: #35b45f; }
  .privchip {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font-size: 10px; font-weight: 800; letter-spacing: .8px; color: #b42563;
  }
  .privchip svg { width: 11px; height: 11px; }
  .achip svg { width: 11px; height: 11px; }
  .achip { display: inline-flex; align-items: center; gap: 4px; }
  .addwrap { position: relative; display: inline-block; }
  .addmenu {
    position: absolute; left: 0; bottom: 36px; z-index: 20; min-width: 225px;
    background: #fff; border: 1px solid #f3d7e4; border-radius: 12px;
    box-shadow: 0 14px 34px rgba(60, 8, 30, .25); padding: 5px;
  }
  .addmenu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: #26212e; }
  .addmenu button:hover { background: #fdf0f6; }
  .addmenu button svg { width: 14px; height: 14px; color: #b42563; flex: none; }
  .addmenu button .mut { color: #9c8494; font-weight: 500; font-size: 11px; }
  .addmenu .sep { border-top: 1px solid rgba(130, 40, 80, .12); margin: 4px 0; }
  .addmenu .priv.on { background: #b42563; color: #fff; }

function invoiceChosen(e) {
  const f = e.target.files && e.target.files[0];

function toggleEdit() {
  if (S.signed) return;   // a signed deal is sealed — changes go through re-open ticket
  S.edit = !S.edit; S.editRow = null; S.shopOpen = false; S.face = 'card'; render();
}
function setEditRow(id) { S.editRow = id; render(); }
function rowSet(id, k, v) {
  const l = S.lines.find(x => x.id === id);
  if (!l) return;
  if (typeof v === 'number' && !(v > 0)) return;   // numbers must stay positive; batch is a string
  l[k] = v;
  render();
}
function rowBump(id, d) { const l = S.lines.find(x => x.id === id); l.units = Math.max(1, l.units + d); render(); }
function delLine(id) {
  S.lines = S.lines.filter(l => l.id !== id);
  S.cond.bundles = S.cond.bundles.filter(b => b.prodId !== id);       // rules about a gone product die with it
  S.cond.discounts = S.cond.discounts.filter(d => +d.scope !== id);   // same for product-scoped discounts
  if (S.editRow === id) S.editRow = null;
  render();
}
function addProduct(i) {
  const s = SHOP[i], id = lineSeq++;
  S.lines.push({ id, name: s.name, batch: s.batch, size: s.size, units: 1, price: s.price });
  S.shopOpen = false;
  S.editRow = id;   // a fresh product lands straight in row-edit
  render();
}
function condSet(k, v) { S.cond[k] = v; render(); }
function addDiscount() { S.cond.discounts.push({ id: discSeq++, amount: '5%', scope: 'deal' }); render(); }
function delDiscount(id) { S.cond.discounts = S.cond.discounts.filter(d => d.id !== id); render(); }
function discInput(id, v) { S.cond.discounts.find(d => d.id === id).amount = v; }   // no render — keeps focus
function discScope(id, v) { S.cond.discounts.find(d => d.id === id).scope = v; render(); }
function addBundle() { S.cond.bundles.push({ id: bundSeq++, prodId: (S.lines[0] || {}).id, attr: 'units', op: '>=', val: 5, thenType: 'discDeal', thenVal: '5%', taken: false }); render(); }
function delBundle(id) { S.cond.bundles = S.cond.bundles.filter(b => b.id !== id); render(); }
function bundSet(id, k, v) { S.cond.bundles.find(b => b.id === id)[k] = v; render(); }
function bundText(id, k, v) { S.cond.bundles.find(b => b.id === id)[k] = v; }       // no render — keeps focus
function takeBundle(id) {
  if (S.signed) return;   // sealed deal — the offer is no longer on the table
  const b = S.cond.bundles.find(x => x.id === id);
  b.taken = !b.taken;
  if (b.taken) pushDealMsg('The buyer took a bundle deal — ' + bundleSentence(b));
  render();
}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const escAttr = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

/* product rules: name never editable; the buyer may change size/units but NEVER price */
const SIZES = [100, 250, 500, 1000];
const lineCells = l => `<td class="num mono">${l.batch}</td><td class="num mono">${l.size} g</td><td class="num mono">${l.units}</td><td class="num mono">${perg(l.price)}</td><td class="num mono">${eur(lineTotal(l))}</td>`;

function renderLinesTable() {
  const E = S.edit, p = S.pending;
  const rows = [];
  for (const l of S.lines) {
    if (p && l.id === p.removesLineId) {   // the diff pair is not row-editable
      rows.push(`<tr class="removed"><td>${esc(l.name)}</td>${lineCells(l)}${E ? '<td></td>' : ''}</tr>`);

        <td class="num">${role === 'seller'

          : `<span class="mono">${perg(l.price)}</span> <span class="locksm" title="Only the seller can change the price">${ICONS.lock}</span>`}</td>

    </div>` : '';
  return `<table class="lines">
    <thead><tr><th>Product</th><th style="text-align:right">Batch</th><th style="text-align:right">Unit size</th><th style="text-align:right">Units</th><th style="text-align:right">Price</th><th style="text-align:right">Total</th>${E ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows.join('')}</tbody>

}

/* ===== part 5: extra conditions (seller-only edit; buyer looks, never touches) ===== */
const PAY_OPTS = ['14 days net · 2% Skonto 7d', '30 days net', '60 days net', 'Prepayment'];
const discScopeName = s => s === 'deal' ? 'the whole deal' : (S.lines.find(l => l.id === +s) || { name: 'a removed product' }).name;
/* bundle rule vocabulary: x = a product attribute, y = the reward */
const ATTRS = { qty: 'quantity (g)', units: 'units', price: 'price (€/g)' };
const OPS = { '>=': '≥', '=': '=', '<=': '≤' };
const THENS = { delivery: 'free delivery', discDeal: 'discount — whole deal', discProd: 'discount — this product' };

function bundleSentence(b) {
  const prod = S.lines.find(l => l.id === b.prodId);
  const then = b.thenType === 'delivery' ? 'free delivery on the order'
    : `${b.thenVal || '…'} off ${b.thenType === 'discDeal' ? 'the whole deal' : 'this product'}`;
  return `If ${prod ? prod.name : 'a removed product'} · ${ATTRS[b.attr]} ${OPS[b.op]} ${b.val} → ${then}`;
}

function renderConds() {
  const c = S.cond;
  const E = S.edit && role === 'seller';
  const card = (label, val) => `<div class="condcard"><div class="plabel">${label}</div><div class="tval">${val}</div></div>`;
  const cards = [card('Quality', esc(c.quality)), card('Logistics', esc(c.logistics))];
  cards.push(card('Payment', E
    ? `<select onchange="condSet('payment', this.value)">${PAY_OPTS.map(o => `<option ${o === c.payment ? 'selected' : ''}>${o}</option>`).join('')}</select>`
    : esc(c.payment)));
  if (E) {
    cards.push(card('Deal expiry', `<input type="date" value="${c.expiry}" onchange="condSet('expiry', this.value)" />`));
    cards.push(card('Delivery',
      `<label><input type="checkbox" ${c.freeDelivery ? 'checked' : ''} onchange="condSet('freeDelivery', this.checked)" /> Free delivery</label>`
      + (c.freeDelivery ? '' : `<input type="date" value="${c.deliveryDate}" onchange="condSet('deliveryDate', this.value)" style="margin-top:6px" />`)));
  } else {
    if (c.expiry) cards.push(card('Deal expiry', `<span class="mono">${c.expiry}</span>`));
    if (c.freeDelivery) cards.push(card('Delivery', 'Free delivery'));
    else if (c.deliveryDate) cards.push(card('Delivery date', `<span class="mono">${c.deliveryDate}</span>`));
    for (const d of c.discounts) cards.push(card('Discount', `${esc(d.amount)} on ${esc(discScopeName(d.scope))}`));
  }
  /* bundle deals: the BUYER gets the take-button (mini-deal, marketplace style);
     the seller just sees whether it was taken */
  const bundleCards = E ? '' : c.bundles.map(b =>
    `<div class="condcard wide">
      <div><div class="plabel">Bundle deal</div><div class="tval">${esc(bundleSentence(b))}</div></div>
      ${role === 'buyer'
        ? `<button class="takebtn ${b.taken ? 'taken' : ''}" onclick="takeBundle(${b.id})">${b.taken ? '✓ Taken — in the deal' : '+ Take the deal'}</button>`
        : `<span class="plabel" style="margin-left:auto; flex:none; ${b.taken ? 'color:var(--ok)' : ''}">${b.taken ? '✓ taken by the buyer' : 'waiting for the buyer'}</span>`}
    </div>`).join('');
  const buyerHint = S.edit && role === 'buyer'
    ? `<div class="ghint" style="padding:12px 0 0">Extra conditions belong to the seller — you can look, not touch.</div>` : '';
  const editRows = !E ? '' : `<div class="condedit">
    ${c.discounts.map(d => `<div class="condrow"><span class="plabel" style="width:64px">Discount</span>
      <input style="width:64px" value="${escAttr(d.amount)}" oninput="discInput(${d.id}, this.value)" />
      <span>on</span>
      <select onchange="discScope(${d.id}, this.value)">
        <option value="deal" ${d.scope === 'deal' ? 'selected' : ''}>the whole deal</option>
        ${S.lines.map(l => `<option value="${l.id}" ${+d.scope === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}
      </select>
      <button class="icobtn" title="Remove" onclick="delDiscount(${d.id})">${ICONS.trash}</button></div>`).join('')}

        <td><select onchange="bundSet(${b.id}, 'attr', this.value)">${Object.entries(ATTRS).map(([k, lbl]) => `<option value="${k}" ${k === b.attr ? 'selected' : ''}>${lbl}</option>`).join('')}</select></td>

/* ===== part 7: notes — one per party, blank never shown, edit only your own ===== */
function renderNotes() {

      ? `<textarea placeholder="Write your note — the other side will see it" oninput="noteInput('${n.id}', this.value)">${esc(n.text)}</textarea>`

}

/* ===== part 8: decision — role-aware two-sided signing:

function renderDecision() {
  const seller = role === 'seller';
  if (S.pending) return seller ? `<div class="actions2">
      <span class="status">The buyer proposed a change — sign it, or negotiate in the chat</span>
      <button class="btn2 neg" onclick="negotiate()">Negotiate</button>

    </div>` : `<div class="actions2">
      <span class="status">Your side proposed this change — the seller signs next</span>
      <button class="btn2 neg" onclick="negotiate()">Negotiate</button>
    </div>`;
  if (S.buyerSigned) return `<div class="actions2">
      <span class="status">Deal closed — signed by both sides <span class="fdoc" title="${escAttr(S.invoiceFile)}">${ICONS.pdf}</span></span>
      <button class="btn2 ghost">Re-open a ticket<span class="later2">LATER</span></button>
    </div>`;
  if (S.finalized) return seller ? `<div class="actions2">
      <span class="status">Invoice uploaded <span class="fdoc" title="${escAttr(S.invoiceFile)}">${ICONS.pdf}</span> — waiting for the buyer to sign after delivery</span>
    </div>` : `<div class="actions2">

      <span class="status">The seller signed — waiting for the invoice</span>
    </div>`;
  return `<div class="actions2"><span class="status">Nothing waiting — edit the card ✎ or keep talking</span></div>`;
}

/* ================= THINGS (to-dos with action words) ================= */
/* all action words wear the same pink (Ayush 2026-07-03) */
const THING_PINK = { c: '#b42563', bg: 'rgba(255,255,255,.78)' };
const THING_ACTIONS = {
  upload:  { label: 'Upload',  ...THING_PINK },
  approve: { label: 'Approve', ...THING_PINK },
  confirm: { label: 'Confirm', ...THING_PINK },
  review:  { label: 'Review',  ...THING_PINK },
  pay:     { label: 'Pay',     ...THING_PINK },
  sign:    { label: 'Sign',    ...THING_PINK },
  custom:  { label: 'Custom',  ...THING_PINK },
};
let thingSeq = 5;
let pendingUploadId = null;
let addMenuOpen = false;
let focusThing = false, focusRename = false;   // focus only on explicit intent, never on background renders
let addPrivate = false;   // private/secret is the FIRST choice when adding a thing
let thingDraft = null;    // { type: 'free'|'upload'|'approve', private, text, assignee, atQuery, atPos }

/* WhatsApp-style mention: typing after @ filters the names live */
function atMatches() {
  const q = (thingDraft.atQuery || '').toLowerCase();
  return PEOPLE.filter(p => p.side !== 'external')
    .map(p => p.id === 'you' ? { name: 'You', co: 'StonePharm GmbH' } : { name: p.name, co: p.co })
    .filter(p => p.name.toLowerCase().includes(q));
}

function atMenuHtml() {
  const m = atMatches();
  const items = m.length
    ? m.map(p => `<button onclick="pickAt('${p.name === 'You' ? 'You' : p.name.split(' ')[0]}')">${esc(p.name)}<span>${esc(p.co)}</span></button>`).join('')
    : `<div style="padding:8px 10px; font-size:11px; color:#9c8494">No match — keep typing or Esc</div>`;
  return `<div class="atmenu" id="atmenu" onclick="event.stopPropagation()">${items}</div>`;
}

/* update only the floating menu while typing, so the input never loses focus */
function updateAtMenu() {
  const row = document.getElementById('draftrow');
  const menu = document.getElementById('atmenu');
  if (!thingDraft || thingDraft.atQuery === null) { if (menu) menu.remove(); return; }
  if (menu) menu.outerHTML = atMenuHtml();
  else if (row) row.insertAdjacentHTML('beforeend', atMenuHtml());
}

function renderThings() {
  /* a PRIVATE thing exists only for the side that wrote it — the other view never sees it */
  const visible = S.things.filter(t => !t.private || t.side === role);
  const rows = visible.map(t => {
    const a = t.action === 'upload' || t.action === 'approve' ? THING_ACTIONS[t.action] : null;
    return `<div class="item2 ${t.done ? 'done' : ''} ${t.private ? 'priv' : ''}">
      <button class="cb2" title="Tick when done" onclick="toggleThing(${t.id})">${t.done ? '✓' : ''}</button>
      ${a ? `<button class="achip" style="color:${a.c}; background:${a.bg}" title="${t.action === 'upload' ? 'Click to upload the document' : 'Click when done'}" onclick="thingAct(${t.id})">${t.action === 'upload' ? ICONS.up : ICONS.check}${a.label}</button>` : ''}
      <span class="ttext">${esc(t.text)}</span>
      ${t.file ? `<span class="fdoc" title="${escAttr(t.file)}">${ICONS.pdf}</span>` : ''}
      ${t.assignee ? `<span class="asg ${t.assignee === 'You' ? 'me' : ''}">@${esc(t.assignee)}</span>` : ''}
      ${t.private ? `<span class="privchip">${ICONS.lock} ONLY YOU</span>` : ''}
    </div>`;
  }).join('');

  const d = thingDraft;
  const draftRow = d ? `
    <div class="item2 draft" id="draftrow" onclick="event.stopPropagation()">
      <span class="cb2" style="opacity:.35"></span>
      ${d.private ? `<span class="privchip">${ICONS.lock} PRIVATE</span>` : ''}
      ${d.type === 'upload' ? `<span class="achip" style="color:#b42563; background:rgba(255,255,255,.78)">${ICONS.up}Upload</span>` : ''}
      ${d.assignee ? `<span class="asg">@${esc(d.assignee)}</span>` : ''}
      <input id="thinginp" class="tinp"
        placeholder="write it… @ tags someone · Enter adds it"
        value="${escAttr(d.text)}" oninput="draftInput(this)" onkeydown="draftKey(event)" />
      ${d.atQuery !== null ? atMenuHtml() : ''}
    </div>` : '';

  return `<div class="items2">
    <div class="plabel">Open items <span class="cnt">${visible.filter(t => !t.done).length}</span></div>
    ${rows}
    ${draftRow}
    <div class="addwrap">
      <button class="addthing" onclick="event.stopPropagation(); toggleAddMenu()">+ Add something</button>
      ${addMenuOpen ? `<div class="addmenu" onclick="event.stopPropagation()">
        <button class="priv ${addPrivate ? 'on' : ''}" onclick="addPrivate = !addPrivate; render()">${ICONS.lock} Private / secret <span class="mut">${addPrivate ? 'ON — only your company' : 'choose first'}</span></button>
        <div class="sep"></div>
        <button onclick="pickThingType('free')">${ICONS.text} Free text</button>
        <button onclick="pickThingType('upload')">${ICONS.up} Upload</button>
        <button onclick="pickThingType('approve')">${ICONS.at} Approve <span class="mut">@ someone</span></button>
      </div>` : ''}
    </div>
  </div>
  <input type="file" id="fup" style="display:none" onchange="fileChosen(event)" />`;
}

function toggleAddMenu() {
  addMenuOpen = !addMenuOpen;
  if (addMenuOpen) { addPrivate = false; thingDraft = null; }
  render();
}
function pickThingType(type) {
  // approve pre-writes the @ — the name list opens and filters as you type, WhatsApp-style
  thingDraft = {
    type, private: addPrivate, assignee: null,
    text: type === 'approve' ? '@' : '',   // approve pre-writes the @ — list waits for your letters
    atQuery: null,
    atPos: 0,
  };
  addMenuOpen = false;
  focusThing = true;
  render();
}

function draftInput(el) {
  const v = el.value;
  thingDraft.text = v;
  const i = v.lastIndexOf('@');
  if (i >= 0 && (i === 0 || v[i - 1] === ' ') && i < v.length - 1) {
    thingDraft.atQuery = v.slice(i + 1);   // list opens only once you TYPE after the @
    thingDraft.atPos = i;
  } else {
    thingDraft.atQuery = null;             // bare @ = wait, no popup yet
  }
  updateAtMenu();   // only the floating list updates — the input keeps focus
}

function pickAt(name) {
  const d = thingDraft;
  d.text = d.text.slice(0, d.atPos).trimEnd();   // strip the @query from the text
  d.assignee = name;
  d.atQuery = null;
  focusThing = true;
  render();
}

function draftKey(e) {
  if (e.key === 'Escape') {
    if (thingDraft.atQuery !== null) { thingDraft.atQuery = null; updateAtMenu(); return; }
    thingDraft = null; render(); return;
  }
  if (e.key !== 'Enter') return;
  const d = thingDraft;
  if (d.atQuery !== null) {   // Enter while the list is open picks the top match
    const m = atMatches();
    if (m.length) pickAt(m[0].name === 'You' ? 'You' : m[0].name.split(' ')[0]);
    return;
  }
  if (!d.text.trim()) return;
  if (d.type === 'approve' && !d.assignee) {   // approve needs a someone — put the @ back, wait for typing
    if (!d.text.endsWith('@')) d.text += d.text.endsWith(' ') ? '@' : ' @';
    focusThing = true;
    render();
    return;
  }
  S.things.push({ id: thingSeq++, action: d.type === 'free' ? 'free' : d.type, text: d.text.trim(), assignee: d.assignee, done: false, file: null, private: d.private, side: role });
  thingDraft = null;
  render();
}

function thingAct(id) {
  const t = S.things.find(x => x.id === id);
  if (t.action === 'upload' && !t.done) {
    pendingUploadId = id;
    document.getElementById('fup').click();   // Upload is a REAL action: opens the file picker
    return;
  }
  t.done = !t.done;   // other action words toggle done
  render();
}

function toggleThing(id) {
  const t = S.things.find(x => x.id === id);
  t.done = !t.done;
  render();
}

function fileChosen(e) {
  const t = S.things.find(x => x.id === pendingUploadId);
  const f = e.target.files && e.target.files[0];
  if (t && f) { t.file = f.name; t.done = true; }
  pendingUploadId = null;
  render();
}

function sigRow(label, val) {
  return `<div class="sigrow"><div class="sigl">${label}</div><div class="sigv">${val}</div></div>`;
}

function renderSignals() {
  const p = S.pending;
  const rows = [];
  rows.push(sigRow('Version', p
    ? `<span class="mono">v${S.version}</span> current · <span class="wt">v${S.version + 1} proposed</span>`
    : `<span class="mono">v${S.version}</span> — current, all changes applied`));
  rows.push(sigRow('Turn', p
    ? (role === 'seller' ? `<span class="wt">Your turn</span> — the buyer is waiting on you`
                         : `<span class="wt">Seller's turn</span> — your side proposed this change`)
    : `<span class="okt">All agreed</span> — nothing waiting on anyone`));
  if (p) {
    rows.push(sigRow('On the table', `Pedanios <s>3.80 €/g</s> → <span class="up">3.60 €/g</span>`));
    rows.push(sigRow('Commitment', `<s>${p.termFrom}</s> → <span class="up">${p.termTo}</span>`));
    rows.push(sigRow('Proposed by', `The buyer · today 10:08`));
  } else {
    if (S.buyerSigned) rows.push(sigRow('Status', `<span class="okt">Closed</span> — signed by both sides`));
    else if (S.finalized) rows.push(sigRow('Status', `<span class="okt">Finalized</span> — invoice attached, waiting on the buyer's signature`));
    rows.push(sigRow('Commitment', S.term));
    rows.push(sigRow('Total net', `<span class="mono">${eur(dealTotal(S.lines))}</span>`));
    rows.push(sigRow('Things open', `${S.things.filter(t => !t.done).length} of ${S.things.length} still to do`));
  }
  return `<div class="siglist">${rows.join('')}</div>`;
}

function renderVersions() {
  return `<div class="vlist">${S.versions.map(v =>
    `<div class="ventry ${v.pending ? 'pending' : ''}">
       <div class="vv mono">${v.v}</div>

function renderBackFace() {

        <div class="wordmark disp">He::oSe::o</div>

          <div>HS-AUR07-CAN23-A189371</div>

/* ================= GROUP CREATION ================= */
function openGroupModal(from) {
  modal = { from, picked: ['you'], name: '', q: '', extPending: null, extClicks: 0 };
  ncOpen = false;
  render();
}
function closeModal() { modal = null; render(); }

function togglePick(id) {
  const p = PEOPLE.find(x => x.id === id);
  if (modal.picked.includes(id)) {
    modal.picked = modal.picked.filter(x => x !== id);
  } else if (modal.from === 'deal' && p.side === 'external') {
    modal.extPending = id;   // external in a deal group → double-approval gate
    modal.extClicks = 0;
  } else {
    modal.picked.push(id);
  }
  render();
}
function extApprove() {
  modal.extClicks++;
  if (modal.extClicks >= 2) { modal.picked.push(modal.extPending); modal.extPending = null; }
  render();
}
function extCancel() { modal.extPending = null; render(); }

function createGroup() {
  const m = modal;
  const others = PEOPLE.filter(p => m.picked.includes(p.id) && p.id !== 'you').map(p => p.name.split(' ')[0]);
  const namesLine = [...others, 'You'].join(', ');
  const fallback = m.from === 'deal' ? 'HS-AUR07-CAN23-A189371' : others.join(', ');
  const conv = {
    id: 'new' + groupSeq++,
    kind: m.from === 'deal' ? 'deal' : 'group',   // deal-born → always under the Deals filter
    av: '', icon: m.from === 'deal' ? 'receipt' : 'users',
    names: namesLine,
    subject: m.name.trim() || fallback,
    preview: 'You created this group', time: 'now', unread: false,
    dealId: m.from === 'deal' ? 'A189371' : null,
    msgs: [{ sys: true, txt: `Group created by you · ${namesLine}${m.from === 'deal' ? ' · tied to HS-AUR07-CAN23-A189371' : ''}` }],
  };
  CONVOS.unshift(conv);
  modal = null;
  activeId = conv.id;              // the new group replaces the open chat
  S.docOpen = !!conv.dealId;       // deal-born: the card opens with it · plain group: the deal closes completely
  S.face = 'card';
  render();
}

function personRow(p) {
  const locked = p.id === 'you';
  const on = modal.picked.includes(p.id);
  const init = p.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const badge = modal.from === 'deal'
    ? (p.side === 'stone' ? '<span class="badge bst">Your side</span>'
      : p.side === 'aurora' ? '<span class="badge bau">Counterparty</span>'
      : '<span class="badge bex">External</span>')
    : (p.side === 'stone' ? '<span class="badge bst">Internal</span>'
      : '<span class="badge bex">External</span>');
  return `<div class="person ${on ? 'on' : ''} ${locked ? 'locked' : ''}" onclick="${locked ? '' : `togglePick('${p.id}')`}">
    <div class="pav">${init}</div>
    <div class="pnm">${esc(p.name)}</div>
    <div class="pco">${esc(p.co)}</div>
    <div>${badge}</div>
    <div class="pcheck">${on ? '✓' : ''}</div>
  </div>`;
}

function peopleSections() {
  const q = (modal.q || '').trim().toLowerCase();
  const match = p => !q || p.name.toLowerCase().includes(q) || p.co.toLowerCase().includes(q);
  const sec = (label, pred) => {
    const rows = PEOPLE.filter(p => pred(p) && match(p)).map(personRow).join('');
    return rows ? `<div class="gsec">${label}</div>${rows}` : '';
  };
  const out = modal.from === 'deal'
    ? sec('StonePharm — your side', p => p.side === 'stone')
      + sec('Aurora Deutschland — counterparty', p => p.side === 'aurora')
      + sec('External — NOT part of this deal', p => p.side === 'external')
    : sec('Internal — StonePharm, my company', p => p.side === 'stone')
      + sec('External — all other companies', p => p.side !== 'stone');
  return out || `<div class="ghint" style="padding:12px 8px">No people match "${esc(modal.q)}".</div>`;
}

function refreshPplList() {
  const el = document.getElementById('ppllist');
  if (el) el.innerHTML = peopleSections();
}

function renderGroupModal() {
  const m = modal;
  const ext = m.extPending ? PEOPLE.find(p => p.id === m.extPending) : null;
  return `<div class="gmodal" onclick="if (event.target === this) closeModal()">
    <div class="gpanel">
      <h3 class="disp">${m.from === 'deal' ? 'Talk about this deal' : 'New group'}</h3>
      <div class="gsub">${m.from === 'deal'
        ? 'Pick people to include — this group is tied to DEAL — HS-AUR07-CAN23-A189371 and lives under the Deals filter.'
        : 'Pick people to include.'}</div>
      <input class="gsearch" placeholder="🔍 Search people or companies…" value="${escAttr(m.q)}" oninput="modal.q = this.value; refreshPplList()" />
      <div class="phead"><span></span><span>Name</span><span>Company</span><span>${m.from === 'deal' ? 'Deal side' : 'Relation'}</span><span></span></div>
      <div class="plist" id="ppllist">${peopleSections()}</div>
      ${ext ? `<div class="extwarn">
        <b>⚠ EXTERNAL PARTY IS BEING ADDRESSED</b><br/>
        ${esc(ext.name)} (${esc(ext.co)}) is not one of the two deal parties. Two approval clicks are required.
        <div class="exbtns">
          <button class="exok" onclick="extApprove()">Approve — click ${m.extClicks + 1} of 2</button>
          <button class="exno" onclick="extCancel()">Cancel</button>
        </div>
      </div>` : ''}
      <div class="gsec">Give this group a name (optional)</div>
      <input class="gname" placeholder="Clarification for April delivery" value="${escAttr(m.name)}" oninput="modal.name = this.value" />
      <div class="ghint">${m.from === 'deal'
        ? 'No name → the deal code becomes the title. You can rename it anytime from the chat window.'
        : 'No name → first names become the title (Alice, Bob). You can rename it anytime from the chat window.'}</div>
      <div class="gfoot">
        <button class="gcancel" onclick="closeModal()">Cancel</button>
        <button class="gcreate" ${m.picked.length < 2 ? 'disabled' : ''} onclick="createGroup()">Create group</button>
      </div>
    </div>
  </div>`;
}

function dealChipHtml() {
  const pendingDot = S.pending ? 'pending' : '';
  return `<button class="dealchip ${S.docOpen ? 'on' : ''}" onclick="toggleDoc()">
    <span class="doc">${ICONS.receipt}</span> Deal <span class="mono">A189371</span>
    <span class="dot ${pendingDot}"></span>
  </button>`;
}

/* ================= LAYOUT (chosen: side panel + flip) ================= */
function render() {
  const stage = document.getElementById('stage');
  const showDoc = S.docOpen && !!activeConvo().dealId;   // the deal panel exists only inside its own chat
  stage.innerHTML = renderChatCol() + (showDoc ? `
    <div class="docpanel">
      <div class="dtoolbar">
        <button class="tbtn icon" title="Close" onclick="toggleDoc()">${ICONS.x}</button>
        <button class="tbtn" onclick="openGroupModal('deal')">${ICONS.chat} Talk about this deal</button>
        <button class="tbtn" onclick="flipTo('${S.face === 'card' ? 'back' : 'card'}')">${S.face === 'card' ? ICONS.clock + ' Activity' : ICONS.flip + ' Deal Card'}</button>
        <div class="tspace"></div>
        ${S.signed
          ? `<span class="tbtn icon" title="Signed — re-open a ticket to change the deal" style="opacity:.55; cursor:default">${ICONS.lock}</span>`
          : `<button class="tbtn icon ${S.edit ? 'on' : ''}" title="${S.edit ? 'Done editing' : 'Edit the deal'}" onclick="toggleEdit()">${S.edit ? ICONS.check : ICONS.pencil}</button>`}
      </div>
      <div class="docscroll">
        <div class="paperwrap">
          ${S.face === 'card' ? renderCardFace() : renderBackFace()}
        </div>
      </div>
    </div>` : '') + (modal ? renderGroupModal() : '');
  renderChatList();
  renderDemobar();
  const m = document.getElementById('msgs');
  if (m) m.scrollTop = m.scrollHeight;
  /* focus only when the user just opened/changed the input — a background
     render must never steal the caret (e.g. typing in the chat composer) */
  const ri = document.getElementById('rninp');
  if (ri && focusRename) { ri.focus(); ri.select(); focusRename = false; }
  const ti = document.getElementById('thinginp');
  if (ti && thingDraft && focusThing) {
    ti.focus();
    ti.setSelectionRange(ti.value.length, ti.value.length);
    focusThing = false;
  }
}

function renderDemobar() {
  document.getElementById('demobar').innerHTML = `
    <span class="dtag">DEMO</span>
    <span class="seg">
      <button class="${role === 'seller' ? 'on' : ''}" onclick="setRole('seller')">Seller view</button>
      <button class="${role === 'buyer' ? 'on' : ''}" onclick="setRole('buyer')">Buyer view</button>
    </span>
    <button onclick="proposeChange()">Buyer proposes a change</button>
    <button onclick="resetAll()">Reset</button>`;
}

function selectConvo(id) {
  if (id !== activeId) {
    activeId = id;
    S.docOpen = false;   // a deal belongs to its chat — switching chats closes the deal completely
    S.face = 'card';
    renaming = false;
  }
  render();
}

function startRename() { renaming = true; rnVal = activeConvo().subject; focusRename = true; render(); }
function rnKey(e) {
  if (e.key === 'Escape') { renaming = false; render(); return; }
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (v) activeConvo().subject = v;
  renaming = false;
  render();
}

function toggleDoc() { S.docOpen = !S.docOpen; S.face = 'card'; render(); }
function openDoc() { S.docOpen = true; S.face = 'card'; render(); }
function flipTo(face) { S.face = face; render(); }
function setBackTab(t) { S.backTab = t; render(); }

function sendKey(e) {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  convoMsgs(activeConvo()).push({ who: 'out', txt: e.target.value.trim(), meta: 'You · now' });
  e.target.value = '';
  render();
  const inp = document.querySelector('.composer .box input');   // the send came from here — give the caret back
  if (inp) inp.focus();
}

render();
</script>
</body>
</html>
