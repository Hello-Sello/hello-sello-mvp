<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Sello — Phase 1 Onboarding Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900">
  <!-- Header -->
  <header class="border-b bg-white sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-pink-600 font-bold text-lg">Hello Sello</div>
        <span class="text-xs text-slate-400">— Phase 1 prototype (throwaway)</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="toggle-panel-btn" class="text-xs px-3 py-1.5 rounded border border-slate-200 hover:bg-slate-100">
          Toggle data panel
        </button>
        <button id="reset-btn" class="text-xs px-3 py-1.5 rounded border border-red-200 text-red-600 hover:bg-red-50">
          Reset DB
        </button>
      </div>
    </div>
  </header>

  <!-- Main layout -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid gap-6" style="grid-template-columns: 1fr 380px;">
    <!-- App shell -->
    <section id="app-shell" class="bg-white rounded-lg border border-slate-200 min-h-[560px] relative overflow-hidden">
      <div id="app-topbar" class="hidden border-b border-slate-200 px-4 py-2 items-center justify-between">
        <div class="flex items-center gap-3 text-sm">
          <span class="text-slate-700 font-medium" id="app-current-user"></span>
          <span class="text-slate-400 text-xs" id="app-current-company"></span>
        </div>
      </div>
      <div id="flow-progress" class="hidden border-b border-slate-200 px-4 py-2 text-xs text-slate-500"></div>
      <div id="screen-root" class="p-6"></div>
    </section>

    <!-- Data state panel -->
    <aside id="data-panel" class="bg-white rounded-lg border border-slate-200 p-4 h-fit sticky top-20">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-sm font-semibold text-slate-700">Data state</h3>
        <span class="text-[10px] text-slate-400 uppercase tracking-wide">mock DB · localStorage</span>
      </div>
      <p class="text-xs text-slate-500 mb-3">Rows that exist after the current step. New rows highlight briefly.</p>
      <div id="data-tables" class="space-y-2 text-xs max-h-[600px] overflow-y-auto"></div>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
