<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product card — all-info front + lab back</title>
<!--
  THROWAWAY PROTOTYPE — Phase 7. The finalized PRODUCT CARD: an all-product-info
  FRONT (every `product` field) that flips to a lab-data BACK (measured CoA +
  batch + terpenes + genetics + docs + Sella). App theme (globals.css tokens).
  Photos: tries img/p{n}.jpg (drop real shots there) → loremflickr → gradient.
  Click a card to flip; hover for the collectible tilt/sheen. No build, no React.
-->
<style>
  :root{
    --brand:#e30b5d;--brand-soft:#ffb7d5;--brand-deep:#76002d;--ink:#1f2020;--ink-muted:#6b6470;
    --success:#34b233;--info:#6c7bd9;--glass-shadow:0 10px 34px -12px rgba(118,0,45,.18);--ease:cubic-bezier(.4,.15,.2,1);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(60rem 60rem at 10% -12%,rgba(255,183,213,.55),transparent 60%),radial-gradient(46rem 46rem at 108% 6%,rgba(227,11,93,.10),transparent 55%),linear-gradient(160deg,#fff,#fff1f7);background-attachment:fixed;padding:22px}
  svg{display:block}
  .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:14px;height:14px}.ic.xs{width:12px;height:12px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  h1{font-size:20px;margin:0 0 2px}.sub{color:var(--ink-muted);font-size:13px;margin:0 0 16px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .flipall{border-radius:999px;background:rgba(255,255,255,.7);padding:8px 15px;font-size:12.5px;font-weight:700}
  .legend{margin-left:auto;font-size:12px;color:var(--ink-muted)}

  .row{display:grid;grid-template-columns:repeat(3,minmax(290px,1fr));gap:22px;max-width:1080px}
  @media(max-width:1010px){.row{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:700px){.row{grid-template-columns:1fr;max-width:380px}}

  .card{perspective:1900px;height:640px}
  .tilt{height:100%;transition:transform .12s var(--ease);transform-style:preserve-3d}
  .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s var(--ease)}
  .card.flip .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;background:#fff;box-shadow:0 16px 44px -18px rgba(118,0,45,.42),inset 0 0 0 1px rgba(255,255,255,.6)}
  .back{transform:rotateY(180deg)}

  /* photo */
  .photo{position:relative;height:178px;flex:0 0 178px;overflow:hidden}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .sheen{position:absolute;inset:0;background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(255,255,255,.5),transparent 42%);mix-blend-mode:overlay;opacity:0;transition:opacity .2s;pointer-events:none}
  .card:hover .sheen{opacity:1}
  .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
  .chiplet{background:rgba(31,32,32,.55);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:3px 9px;backdrop-filter:blur(4px)}
  .grade{position:absolute;top:10px;right:46px;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);color:var(--brand-deep);border-radius:999px;font-size:10px;font-weight:800;padding:3px 9px}
  .heart{position:absolute;top:9px;right:10px;width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--brand);display:grid;place-items:center}
  .dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
  .dots span{height:5px;width:5px;border-radius:999px;background:rgba(255,255,255,.6)}.dots span.on{width:14px;background:#fff}
  .flipbtn{position:absolute;bottom:9px;right:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(31,32,32,.6);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:6px 11px;backdrop-filter:blur(4px)}
  .flipbtn:hover{background:var(--ink)}

  /* front */
  .fhead{padding:11px 13px 0;display:flex;align-items:flex-start;gap:8px}
  .name{font-weight:800;font-size:16px;color:var(--brand-deep);line-height:1.15}
  .cult{font-size:12px;color:var(--ink-muted)}.code{font-size:10.5px;color:var(--ink-muted);font-weight:600;margin-top:1px}
  .fhead .flag{font-size:18px;margin-left:auto}
  .quad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 13px 0}
  .quad .c{border:1px solid rgba(118,0,45,.18);border-radius:10px;padding:6px 2px;text-align:center}
  .quad .c b{display:block;font-size:15px;color:var(--brand-deep);font-variant-numeric:tabular-nums;line-height:1}
  .quad .c small{font-size:8.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em}
  .specs{flex:1;overflow:auto;padding:11px 13px 4px;display:flex;flex-direction:column;gap:5px}
  .srow{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;border-bottom:1px dotted rgba(118,0,45,.14);padding-bottom:4px}
  .srow .k{flex:0 0 84px;color:var(--ink-muted);font-weight:600}
  .srow .v{font-weight:700;line-height:1.25}.srow .v.link{color:var(--info)}
  .ffoot{padding:11px 13px 13px;border-top:1px solid rgba(0,0,0,.06)}
  .priceline{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .price{font-weight:800;color:var(--brand-deep);font-size:18px;font-variant-numeric:tabular-nums}
  .price small{font-size:11px;font-weight:600;color:var(--ink-muted)}
  .rrp{font-size:10.5px;color:var(--ink-muted);text-decoration:line-through}
  .bundle{font-size:10.5px;font-weight:700;color:var(--success)}
  .reqprice{font-size:12px;font-weight:800;color:var(--brand-deep);background:rgba(255,183,213,.4);border-radius:999px;padding:6px 12px}
  .addrow{margin-top:10px;display:flex;gap:8px}
  .stepper{display:flex;align-items:center;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgba(118,0,45,.18)}
  .stepper button{width:30px;height:30px;border-radius:999px;color:var(--brand-deep);display:grid;place-items:center}
  .stepper button:hover{background:rgba(255,183,213,.4)}
  .stepper .q{min-width:32px;text-align:center;font-weight:800;font-size:13px}
  .add{flex:1;border-radius:999px;background:var(--brand);color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
  .add:hover{background:var(--brand-deep)}

  /* back (B2 lab data) */
  .bhead{padding:13px 14px;background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff;display:flex;align-items:center;gap:8px}
  .bhead b{font-size:14px;font-weight:800}.bhead .batch{margin-left:auto;font-size:10.5px;font-weight:700;opacity:.9;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px}
  .bscroll{flex:1;overflow:auto;padding:13px 14px}
  .sec{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 7px}.sec.mt{margin-top:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:11px}
  .grid2 div{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(118,0,45,.16);padding-bottom:2px}
  .grid2 .k{color:var(--ink-muted)}.grid2 .v{font-weight:700}
  .terps{display:flex;flex-direction:column;gap:5px}
  .terp{display:flex;align-items:center;gap:8px;font-size:11px}.terp .tn{width:96px;font-weight:700}
  .terp .b{flex:1;height:6px;border-radius:999px;background:rgba(118,0,45,.1);overflow:hidden}.terp .b i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-soft),var(--brand))}
  .terp .pct{width:38px;text-align:right;color:var(--ink-muted);font-variant-numeric:tabular-nums}
  .docrow{display:flex;flex-wrap:wrap;gap:6px}
  .doc{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:9px;background:rgba(255,183,213,.25);padding:6px 10px}
  .sella{margin-top:12px;border-radius:12px;border:1px dashed rgba(108,123,217,.55);background:rgba(108,123,217,.08);padding:11px}
  .sella .t{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#4854a8}
  .sella .stub{margin-top:5px;font-size:10.5px;font-weight:700;color:#4854a8;background:rgba(108,123,217,.14);border-radius:7px;padding:6px 9px;text-align:center}
  .bfoot{padding:11px 14px;border-top:1px solid rgba(0,0,0,.06);display:flex;gap:8px}
  .flipback{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--brand-deep);font-weight:800;font-size:12px;padding:9px}
  .viewpres{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:9px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <h1>Product card — all-info front · lab back</h1>
  <p class="sub">Front carries every <b>product</b> field; flip for the <b>lab data</b> (measured CoA, terpenes, genetics, docs, Sella). Click a card to flip.</p>
  <div class="bar"><button class="flipall" id="flipAll">Flip all</button><span class="legend">Drop real photos in <code>img/p1.jpg…p3.jpg</code> for the craft feel · hover for tilt/sheen</span></div>
  <div class="row" id="row"></div>

<script>
const PRODUCTS=[
 {n:'GL Indica 22/1',cult:'Northern Lights',code:'PZN 17542830',flag:'🇨🇦',dom:'Indica',grade:'AAA',
  img:'cannabis,bud',grad:'linear-gradient(135deg,#6a3,#284)',
  thc:22,cbd:1,cbg:0.8,cbn:0.3, cultivator:'Aurora Farms', origin:'Canada', region:'British Columbia', parentA:'Afghani', parentB:'Thai',
  irr:'Beta', pack:'10 g', unit:'g', packaging:'Glass jar', resealable:true, format:'10 g jar (also 1000 g bulk)', supplierCode:'GL-NL-22',
  rrp:9.50, price:7.40, bundleAt:'100 g', bundlePrice:6.80, priceShown:true,
  batch:'GL-24-0001', mThc:21.6,mCbd:0.9,mCbg:0.7,mCbn:0.3, lod:8.2, aw:0.55, ready:'2025-01-10', expiry:'2026-12', shelf:18,
  terps:[['Myrcene',0.92],['β-Caryophyllene',0.61],['Limonene',0.44],['Pinene',0.31],['Linalool',0.18]], coas:2,imgs:4,vids:1,docs:1},
 {n:'GL Sativa 18/1',cult:'Sour Diesel',code:'PZN 17542847',flag:'🇵🇹',dom:'Sativa',grade:'AA',
  img:'cannabis,flower',grad:'linear-gradient(135deg,#caa64a,#7a5a12)',
  thc:18,cbd:1,cbg:0.6,cbn:0.2, cultivator:'Iberia Bloom', origin:'Portugal', region:'Alentejo', parentA:'Chemdawg', parentB:'Skunk',
  irr:'Not irradiated', pack:'10 g', unit:'g', packaging:'Resealable pouch', resealable:true, format:'10 g pouch', supplierCode:'GL-SD-18',
  rrp:8.20, price:6.90, bundleAt:'100 g', bundlePrice:6.30, priceShown:true,
  batch:'GL-24-0002', mThc:17.8,mCbd:1.1,mCbg:0.5,mCbn:0.2, lod:9.1, aw:0.58, ready:'2025-02-02', expiry:'2027-01', shelf:18,
  terps:[['Limonene',0.71],['Myrcene',0.40],['β-Caryophyllene',0.33],['Terpinolene',0.22],['Ocimene',0.14]], coas:2,imgs:5,vids:1,docs:0},
 {n:'GL Hybrid 20/4',cult:'Gelato 41',code:'PZN 17542854',flag:'🇩🇪',dom:'Indica-Dominant',grade:'AAA',
  img:'cannabis,jar',grad:'linear-gradient(135deg,#7a6cd9,#3a2f8f)',
  thc:20,cbd:4,cbg:1.0,cbn:0.4, cultivator:'GreenLeaf In-house', origin:'Germany', region:'Brandenburg', parentA:'Sunset Sherbet', parentB:'Thin Mint GSC',
  irr:'Beta', pack:'5 g', unit:'g', packaging:'Glass jar', resealable:true, format:'5 g jar', supplierCode:'GL-G41-20',
  rrp:11.0, price:null, bundleAt:null, bundlePrice:null, priceShown:false,
  batch:'GL-24-0003', mThc:19.4,mCbd:4.2,mCbg:0.9,mCbn:0.4, lod:7.6, aw:0.53, ready:'2025-03-15', expiry:'2027-02', shelf:24,
  terps:[['β-Caryophyllene',0.58],['Limonene',0.49],['Linalool',0.30],['Humulene',0.20],['Myrcene',0.16]], coas:1,imgs:3,vids:0,docs:1},
];
const eur=n=>n.toFixed(2).replace('.',',')+'€';
const C=v=>v==null?'n.a.':String(v).replace('.',',');
const yn=b=>b?'Yes':'No';
// photo: local img/pN.jpg → loremflickr → gradient
const photo=(p,i)=>`<img src="img/p${i+1}.jpg" data-fb="https://loremflickr.com/640/400/${p.img}?lock=${i+5}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.display='none';}" alt="${p.cult}">`;

function front(p,i){
  const price=p.priceShown
    ? `<div class="priceline"><span class="price">${eur(p.price)}<small>/g</small></span><span class="bundle">${p.bundleAt?`≥${p.bundleAt} · ${eur(p.bundlePrice)}/g`:''}</span></div><div style="margin-top:2px;font-size:10.5px;color:var(--ink-muted)">UVP <span class="rrp">${eur(p.rrp)}/g</span></div>`
    : `<div class="priceline"><span class="reqprice">Price on request</span></div>`;
  const rows=[
    ['Dominance',p.dom],['Cultivator',p.cultivator],['Origin',`${p.flag} ${p.origin}`],['Region',p.region],
    ['Lineage',`${p.parentA} × ${p.parentB}`],['Irradiation',p.irr],['Format',p.format],
    ['Packaging',p.packaging],['Resealable',yn(p.resealable)],['Supplier code',p.supplierCode],
  ];
  return `<div class="face front">
    <div class="photo" style="background:${p.grad}">${photo(p,i)}<div class="sheen"></div>
      <div class="badges"><span class="chiplet">${p.dom}</span><span class="chiplet">${p.pack}</span></div>
      <span class="grade"><svg class="ic xs" viewBox="0 0 24 24"><path d="m12 3 2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg> ${p.grade}</span>
      <button class="heart"><svg class="ic xs" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/></svg></button>
      <div class="dots"><span class="on"></span><span></span><span></span><span></span></div>
      <button class="flipbtn" data-flip><svg class="ic xs" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 7"/><path d="M3 4v3h3"/></svg> Lab data &amp; docs</button>
    </div>
    <div class="fhead"><div><div class="name">${p.n}</div><div class="cult">${p.cult}</div><div class="code">${p.code}</div></div><span class="flag">${p.flag}</span></div>
    <div class="quad"><div class="c"><b>${C(p.thc)}</b><small>THC%</small></div><div class="c"><b>${C(p.cbd)}</b><small>CBD%</small></div><div class="c"><b>${C(p.cbg)}</b><small>CBG%</small></div><div class="c"><b>${C(p.cbn)}</b><small>CBN%</small></div></div>
    <div class="specs">${rows.map(([k,v])=>`<div class="srow"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>
    <div class="ffoot">${price}<div class="addrow"><div class="stepper"><button data-step="-1"><svg class="ic xs" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><span class="q">1</span><button data-step="1"><svg class="ic xs" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><button class="add"><svg class="ic xs" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.5 12h11"/><path d="M6 6h15l-2 7H7.5"/></svg> Add to basket</button></div></div>
  </div>`;
}
function back(p){
  return `<div class="face back">
    <div class="bhead"><svg class="ic sm" viewBox="0 0 24 24"><path d="M9 3h6v4l4 9a3 3 0 0 1-3 4H8a3 3 0 0 1-3-4l4-9z"/></svg><b>Lab data &amp; documents</b><span class="batch">Batch ${p.batch}</span></div>
    <div class="bscroll">
      <p class="sec">Measured cannabinoids (CoA)</p>
      <div class="quad" style="padding:0"><div class="c"><b>${C(p.mThc)}</b><small>THC%</small></div><div class="c"><b>${C(p.mCbd)}</b><small>CBD%</small></div><div class="c"><b>${C(p.mCbg)}</b><small>CBG%</small></div><div class="c"><b>${C(p.mCbn)}</b><small>CBN%</small></div></div>
      <p class="sec mt">Batch</p>
      <div class="grid2"><div><span class="k">Loss on drying</span><span class="v">${p.lod}%</span></div><div><span class="k">Water activity</span><span class="v">${p.aw}</span></div><div><span class="k">Ready</span><span class="v">${p.ready}</span></div><div><span class="k">Expiry</span><span class="v">${p.expiry}</span></div><div><span class="k">Shelf life</span><span class="v">${p.shelf} mo</span></div><div><span class="k">Genetics</span><span class="v">${p.parentA}×${p.parentB}</span></div></div>
      <p class="sec mt">Terpene profile</p>
      <div class="terps">${p.terps.map(([t,v])=>`<div class="terp"><span class="tn">${t}</span><span class="b"><i style="width:${Math.min(100,v*100)}%"></i></span><span class="pct">${v.toFixed(2)}%</span></div>`).join('')}</div>
      <p class="sec mt">Documents</p>
      <div class="docrow"><span class="doc"><svg class="ic xs" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/></svg> COAs (${p.coas})</span><span class="doc"><svg class="ic xs" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/></svg> Images (${p.imgs})</span>${p.vids?`<span class="doc"><svg class="ic xs" viewBox="0 0 24 24"><path d="m5 3 14 9-14 9z"/></svg> Videos (${p.vids})</span>`:''}${p.docs?`<span class="doc"><svg class="ic xs" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg> Other (${p.docs})</span>`:''}</div>
      <div class="sella"><div class="t"><svg class="ic xs" viewBox="0 0 24 24"><path d="M12 2 4 7v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V7z"/></svg> Sella · Marktvergleich</div><div class="stub">One-time flowzz pull on request — no figure shown (R1)</div></div>
    </div>
    <div class="bfoot"><button class="flipback" data-flip><svg class="ic xs" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7L3 17"/><path d="M3 20v-3h3"/></svg> Back to front</button><a class="viewpres"><svg class="ic xs" viewBox="0 0 24 24"><path d="M4 9h16v11H4z"/><path d="M3 9 5 4h14l2 5"/></svg> Full Present page</a></div>
  </div>`;
}
const row=document.getElementById('row');
row.innerHTML=PRODUCTS.map((p,i)=>`<div class="card" data-i="${i}"><div class="tilt"><div class="inner">${front(p,i)}${back(p)}</div></div></div>`).join('');
row.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;
  if(e.target.closest('[data-step]')){const q=c.querySelector('.q');q.textContent=Math.max(1,+q.textContent+(+e.target.closest('[data-step]').dataset.step));return;}
  if(e.target.closest('.add')||e.target.closest('.viewpres')||e.target.closest('.heart'))return;
  c.classList.toggle('flip');});
row.addEventListener('mousemove',e=>{const c=e.target.closest('.card');if(!c)return;const t=c.querySelector('.tilt'),r=c.getBoundingClientRect();const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;if(!c.classList.contains('flip'))t.style.transform=`rotateY(${(px-.5)*7}deg) rotateX(${(.5-py)*7}deg)`;c.querySelectorAll('.sheen').forEach(s=>{s.style.setProperty('--px',px*100+'%');s.style.setProperty('--py',py*100+'%');});});
row.addEventListener('mouseout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))c.querySelector('.tilt').style.transform='';});
let allBack=false;document.getElementById('flipAll').addEventListener('click',()=>{allBack=!allBack;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('flip',allBack));});
</script>
</body>
</html>
