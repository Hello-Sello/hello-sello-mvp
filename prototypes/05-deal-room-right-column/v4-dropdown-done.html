<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deal Room - Right Column (V4: minimal dropdown + prominent done)</title>
<style>
  /* ---- Damson tokens (copied from src/app/globals.css) ---- */
  :root {
    --brand: #e30b5d;          /* raspberry */
    --brand-soft: #ffb7d5;     /* cotton candy */
    --brand-deep: #7a1638;     /* damson */
    --ink: #1f2020;
    --ink-muted: #6b6470;
    --success: #34b233;
    --info: #6c7bd9;           /* periwinkle */
    --peri: #8b8bdc;           /* periwinkle secondary (per brief) */
    --bg-from: #ffffff;
    --bg-to: #fff1f7;
    --glass-bg: rgba(255,255,255,0.62);
    --glass-bg-strong: rgba(255,255,255,1);
    --glass-border: rgba(255,255,255,0.65);
    --glass-shadow: 0 10px 34px -12px color-mix(in srgb, var(--brand-deep) 18%, transparent);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(60rem 60rem at 10% -12%, rgba(255,183,213,0.55), transparent 60%),
      radial-gradient(46rem 46rem at 108% 6%, rgba(227,11,93,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }
  .glass-strong {
    background: var(--glass-bg-strong);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }

  /* ---- 3-column Deal Room shell ---- */
  .room {
    display: grid;
    grid-template-columns: 232px 1fr 380px;
    gap: 14px;
    max-width: 1180px;
    height: 100vh;
    margin: 0 auto;
    padding: 16px;
  }

  /* faded context columns (left card + middle chat) */
  .ghost {
    border-radius: 22px;
    opacity: 0.42;
    filter: grayscale(0.55);
    pointer-events: none;
    user-select: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .ghost-bar {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 13px 14px;
    border-bottom: 1px solid rgba(31,32,32,0.08);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
  }
  .ghost-bar .arrow {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 9px;
    background: rgba(31,32,32,0.06);
  }
  .ghost-body { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .skel { border-radius: 10px; background: rgba(31,32,32,0.07); }
  .skel.line { height: 11px; }
  .skel.w70 { width: 70%; } .skel.w55 { width: 55%; } .skel.w85 { width: 85%; } .skel.w40 { width: 40%; }
  .skel.block { height: 54px; border-radius: 14px; }
  .skel.chip { height: 30px; width: 64px; border-radius: 999px; }
  .ghost-card-hero { height: 96px; border-radius: 16px; background: linear-gradient(180deg, rgba(122,22,56,0.14), rgba(31,32,32,0.05)); }
  .bubble { max-width: 78%; padding: 10px 12px; border-radius: 14px; }
  .bubble.them { align-self: flex-start; background: rgba(31,32,32,0.06); border-bottom-left-radius: 5px; }
  .bubble.me { align-self: flex-end; background: rgba(255,183,213,0.5); border-bottom-right-radius: 5px; }
  .bubble .skel.line { background: rgba(31,32,32,0.12); margin: 0 0 6px; }
  .bubble .skel.line:last-child { margin: 0; }

  /* =========================================================
     RIGHT COLUMN  -  full fidelity (the whole point)
     ========================================================= */
  .right {
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* header band */
  .right-head {
    padding: 15px 16px 13px;
    border-bottom: 1px solid var(--glass-border);
  }
  .right-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--brand-deep);
    letter-spacing: -0.01em;
  }
  .right-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px rgba(227,11,93,0.16); }
  .right-sub { margin: 3px 0 0 15px; font-size: 11px; color: var(--ink-muted); }

  /* the STAR controls row : minimal dropdown filter  +  prominent done pill */
  .control-row {
    display: flex;
    align-items: stretch;
    gap: 10px;
    margin-top: 14px;
  }

  /* --- stage dropdown (the filter) --- */
  .stage-select { position: relative; flex: 0 0 auto; }
  .stage-trigger {
    display: flex; align-items: center; gap: 9px;
    height: 40px; padding: 0 12px;
    border-radius: 13px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    font: inherit;
    min-width: 184px;
    transition: background .15s, box-shadow .15s;
  }
  .stage-trigger:hover { background: rgba(255,255,255,0.92); }
  .stage-trigger .num {
    width: 20px; height: 20px; flex: none;
    display: grid; place-items: center;
    border-radius: 7px;
    font-size: 11px; font-weight: 700;
    background: rgba(227,11,93,0.12); color: var(--brand-deep);
  }
  .stage-trigger.is-done .num { background: var(--success); color: #fff; }
  .stage-trigger .label-wrap { flex: 1; text-align: left; line-height: 1.05; }
  .stage-trigger .label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .stage-trigger .meta { font-size: 10px; color: var(--ink-muted); margin-top: 1px; }
  .stage-trigger .caret { color: var(--ink-muted); transition: transform .18s; }
  .stage-select.open .caret { transform: rotate(180deg); }

  .stage-menu {
    position: absolute; top: calc(100% + 6px); left: 0;
    width: 244px;
    border-radius: 15px;
    padding: 6px;
    z-index: 30;
    display: none;
    flex-direction: column;
    gap: 2px;
  }
  .stage-select.open .stage-menu { display: flex; }
  .stage-opt {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 9px; border-radius: 10px;
    cursor: pointer; border: none; background: transparent; font: inherit;
    width: 100%; text-align: left;
  }
  .stage-opt:hover { background: rgba(31,32,32,0.05); }
  .stage-opt.active { background: rgba(255,183,213,0.4); }
  .stage-opt .onum {
    width: 19px; height: 19px; flex: none;
    display: grid; place-items: center; border-radius: 6px;
    font-size: 10.5px; font-weight: 700;
    background: rgba(31,32,32,0.08); color: var(--ink-muted);
  }
  .stage-opt.active .onum { background: rgba(227,11,93,0.14); color: var(--brand-deep); }
  .stage-opt.done .onum { background: var(--success); color: #fff; }
  .stage-opt .oname { flex: 1; font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .stage-opt .oprog { font-size: 10px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .stage-opt.done .oprog { color: var(--success); font-weight: 600; }

  /* --- the prominent DONE pill (the done box) --- */
  .done-pill {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 14px;
    border-radius: 13px;
    border: 1px solid transparent;
    cursor: pointer; font: inherit;
    font-size: 12.5px; font-weight: 700; letter-spacing: -0.01em;
    color: #fff;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
    box-shadow: 0 6px 18px -6px rgba(227,11,93,0.55);
    transition: transform .12s, box-shadow .15s, background .2s;
    white-space: nowrap;
  }
  .done-pill:hover { transform: translateY(-1px); box-shadow: 0 9px 22px -6px rgba(227,11,93,0.6); }
  .done-pill:active { transform: translateY(0); }
  .done-pill .tick {
    width: 19px; height: 19px; flex: none;
    display: grid; place-items: center; border-radius: 50%;
    background: rgba(255,255,255,0.22);
  }
  /* done state : green, calm, reversible */
  .done-pill.is-done {
    color: var(--success);
    background: rgba(52,178,51,0.12);
    border-color: rgba(52,178,51,0.4);
    box-shadow: none;
  }
  .done-pill.is-done .tick { background: var(--success); color: #fff; }
  .done-pill.is-done:hover { background: rgba(52,178,51,0.18); transform: none; box-shadow: none; }

  /* segmented control : Things / People / Documents */
  .seg {
    display: flex; gap: 4px;
    margin: 13px 16px 0;
    padding: 4px;
    border-radius: 13px;
    background: rgba(31,32,32,0.045);
  }
  .seg button {
    flex: 1;
    border: none; background: transparent; cursor: pointer; font: inherit;
    padding: 7px 4px; border-radius: 9px;
    font-size: 12px; font-weight: 500; color: var(--ink-muted);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg button .count {
    font-size: 10px; opacity: .65; margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }
  .seg button.active {
    background: var(--glass-bg-strong);
    color: var(--brand-deep); font-weight: 650;
    box-shadow: 0 2px 8px -4px rgba(122,22,56,0.3);
  }

  /* the airy list */
  .list {
    flex: 1; overflow-y: auto;
    padding: 12px 16px 18px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: rgba(31,32,32,0.12); border-radius: 99px; }

  .stage-flag {
    display: flex; align-items: center; gap: 7px;
    font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-muted);
    margin: 2px 2px 1px;
  }
  .stage-flag .pin { color: var(--brand); }

  /* row : a thing */
  .row {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px;
    border-radius: 14px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.7);
    transition: background .14s, transform .14s;
  }
  .row:hover { background: rgba(255,255,255,0.82); }

  .check {
    width: 20px; height: 20px; flex: none;
    border-radius: 7px;
    border: 1.6px solid rgba(31,32,32,0.22);
    background: rgba(255,255,255,0.6);
    cursor: pointer;
    display: grid; place-items: center;
    color: transparent;
    transition: background .14s, border-color .14s, color .14s;
  }
  .check:hover { border-color: var(--brand); }
  .row.checked .check { background: var(--brand); border-color: var(--brand); color: #fff; }
  .row.checked .r-title { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: rgba(31,32,32,0.3); }

  .r-main { flex: 1; min-width: 0; }
  .r-title {
    font-size: 13px; font-weight: 550; color: var(--ink);
    display: flex; align-items: center; gap: 7px;
  }
  .r-title .lock { color: var(--peri); flex: none; }
  .r-meta { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px;
  }
  .tag.doc { background: rgba(108,123,217,0.14); color: var(--info); }
  .tag.priv { background: rgba(139,139,220,0.16); color: var(--peri); }

  /* avatar */
  .ava {
    width: 26px; height: 26px; flex: none;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 10.5px; font-weight: 700; color: #fff;
    letter-spacing: -0.02em;
  }
  .ava.lg { width: 38px; height: 38px; font-size: 13px; }

  /* people row */
  .prow {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 13px;
    border-radius: 14px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.7);
  }
  .prow .p-main { flex: 1; }
  .prow .p-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .prow .p-role { font-size: 11px; color: var(--ink-muted); margin-top: 1px; }
  .p-side { font-size: 10.5px; color: var(--ink-muted); }

  /* document row icon */
  .doc-ic {
    width: 34px; height: 34px; flex: none;
    border-radius: 10px;
    display: grid; place-items: center;
    background: rgba(227,11,93,0.08);
    color: var(--brand-deep);
  }

  .empty { text-align: center; color: var(--ink-muted); font-size: 12px; padding: 30px 10px; }

  .legend {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px 13px;
    border-top: 1px solid var(--glass-border);
    font-size: 10.5px; color: var(--ink-muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .lk { color: var(--peri); }
</style>
</head>
<body>

<div class="room">

  <!-- LEFT : faded Deal Card placeholder (context only) -->
  <aside class="ghost glass">
    <div class="ghost-bar">
      <span class="arrow">&#8592;</span>
      <span>Deal Card</span>
    </div>
    <div class="ghost-body">
      <div class="ghost-card-hero"></div>
      <div class="skel line w70"></div>
      <div class="skel line w55"></div>
      <div class="skel block"></div>
      <div class="skel line w85"></div>
      <div class="skel line w40"></div>
      <div class="skel block"></div>
    </div>
  </aside>

  <!-- MIDDLE : faded chat placeholder (context only) -->
  <section class="ghost glass">
    <div class="ghost-bar">
      <span class="arrow">&#8592;</span>
      <span>Alice Green &middot; Greenleaf Farms</span>
    </div>
    <div class="ghost-body">
      <div class="bubble them"><div class="skel line w85"></div><div class="skel line w55"></div></div>
      <div class="bubble me"><div class="skel line w70"></div></div>
      <div class="bubble them"><div class="skel line w70"></div><div class="skel line w85"></div></div>
      <div class="bubble me"><div class="skel line w55"></div><div class="skel line w40"></div></div>
      <div class="bubble them"><div class="skel line w40"></div></div>
    </div>
  </section>

  <!-- RIGHT : FULL FIDELITY -->
  <aside class="right glass-strong">

    <header class="right-head">
      <div class="right-title"><span class="dot"></span> Deal Workspace</div>
      <div class="right-sub">Filter the work by stage &middot; tick items &middot; mark the stage done</div>

      <!-- THE STAR ROW : minimal dropdown filter  +  prominent done pill -->
      <div class="control-row">

        <div class="stage-select" id="stageSelect">
          <button class="stage-trigger" id="stageTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="num" id="trigNum">1</span>
            <span class="label-wrap">
              <span class="label" id="trigLabel">Negotiation</span>
              <span class="meta" id="trigMeta">1 / 2 done</span>
            </span>
            <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="stage-menu glass-strong" id="stageMenu" role="listbox"></div>
        </div>

        <button class="done-pill" id="donePill">
          <span class="tick" id="doneTick">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <span id="doneLabel">Mark stage done</span>
        </button>

      </div>
    </header>

    <!-- segmented control -->
    <div class="seg" id="seg">
      <button data-tab="things" class="active">Things<span class="count" id="cThings"></span></button>
      <button data-tab="people">People<span class="count" id="cPeople"></span></button>
      <button data-tab="documents">Documents<span class="count" id="cDocs"></span></button>
    </div>

    <!-- the airy list -->
    <div class="list" id="list"></div>

    <div class="legend">
      <span><svg class="lk" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> Private &middot; only your side</span>
      <span>Otherwise shared with both sides</span>
    </div>

  </aside>

</div>

<script>
  // ---- sample data : 5 stages, each with realistic things ----
  const AVATARS = {
    AB: { name: "Alex Brenner", color: "#e30b5d" },
    SK: { name: "Sara Klein",   color: "#6c7bd9" },
    MR: { name: "Marco Ruiz",   color: "#7a1638" },
  };

  const STAGES = [
    {
      code: "negotiation", label: "Negotiation",
      things: [
        { title: "Agree unit price",        assignee: "AB", priv: false },
        { title: "Confirm volume (kg)",     assignee: "SK", priv: true  },
      ],
    },
    {
      code: "compliance", label: "Compliance & Quality",
      things: [
        { title: "Upload CoA",              assignee: "AB", priv: false, doc: true },
        { title: "Lab result review",       assignee: "MR", priv: true  },
      ],
    },
    {
      code: "agreement", label: "Agreement",
      things: [
        { title: "Draft sale contract",     assignee: "SK", priv: false, doc: true },
        { title: "Both sides sign",         assignee: "AB", priv: false },
      ],
    },
    {
      code: "payment", label: "Payment",
      things: [
        { title: "Issue proforma invoice",  assignee: "MR", priv: false, doc: true },
        { title: "Confirm bank receipt",    assignee: "SK", priv: true  },
      ],
    },
    {
      code: "fulfilment", label: "Fulfilment & Delivery",
      things: [
        { title: "Book courier slot",       assignee: "AB", priv: false },
        { title: "Share tracking + POD",    assignee: "MR", priv: false, doc: true },
      ],
    },
  ];

  // people are deal-wide (shown on every stage)
  const PEOPLE = [
    { init: "AB", name: "Alex Brenner", role: "Sales lead - Greenleaf Farms", side: "Seller" },
    { init: "SK", name: "Sara Klein",   role: "Buyer - Stone Pharma",         side: "Buyer"  },
    { init: "MR", name: "Marco Ruiz",   role: "Compliance officer",           side: "Seller" },
  ];

  // documents are deal-wide
  const DOCS = [
    { name: "CoA_batch-A19.pdf",        meta: "Compliance & Quality &middot; 240 KB", priv: false },
    { name: "Sale-contract_v2.pdf",     meta: "Agreement &middot; 88 KB",             priv: false },
    { name: "Internal-margin-note.pdf", meta: "Negotiation &middot; 31 KB",           priv: true  },
  ];

  // ---- state ----
  // stages already done (pre-set so the done-state is visible)
  const doneStages = new Set(["negotiation", "compliance"]);
  // seed a few ticked things; compliance fully ticked so it reads as done
  const checked = new Set([
    "negotiation::0",
    "compliance::0", "compliance::1",
  ]);
  let selected = 0;      // index into STAGES
  let tab = "things";

  // ---- helpers ----
  const $ = (s) => document.querySelector(s);
  const lockSvg = '<svg class="lock" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';

  function stageProgress(i) {
    const st = STAGES[i];
    const total = st.things.length;
    const done = st.things.filter((_, j) => checked.has(st.code + "::" + j)).length;
    return { done, total };
  }
  function avatar(init, lg) {
    const a = AVATARS[init];
    return '<span class="ava' + (lg ? ' lg' : '') + '" style="background:' + a.color + '">' + init + '</span>';
  }

  // ---- render : stage dropdown ----
  function renderDropdown() {
    const st = STAGES[selected];
    const { done, total } = stageProgress(selected);
    const isDone = doneStages.has(st.code);

    $("#trigNum").textContent = selected + 1;
    $("#trigLabel").textContent = st.label;
    $("#trigMeta").textContent = isDone ? "Stage complete" : (done + " / " + total + " done");
    $("#stageTrigger").classList.toggle("is-done", isDone);

    const menu = $("#stageMenu");
    menu.innerHTML = STAGES.map((s, i) => {
      const p = stageProgress(i);
      const d = doneStages.has(s.code);
      return '<button class="stage-opt ' + (i === selected ? 'active ' : '') + (d ? 'done' : '') + '" data-idx="' + i + '" role="option">' +
        '<span class="onum">' + (d ? '&#10003;' : (i + 1)) + '</span>' +
        '<span class="oname">' + s.label + '</span>' +
        '<span class="oprog">' + (d ? 'done' : (p.done + '/' + p.total)) + '</span>' +
        '</button>';
    }).join("");
    menu.querySelectorAll(".stage-opt").forEach((b) => {
      b.addEventListener("click", () => {
        selected = +b.dataset.idx;
        $("#stageSelect").classList.remove("open");
        $("#stageTrigger").setAttribute("aria-expanded", "false");
        renderAll();
      });
    });
  }

  // ---- render : the prominent done pill ----
  function renderDonePill() {
    const st = STAGES[selected];
    const isDone = doneStages.has(st.code);
    const pill = $("#donePill");
    pill.classList.toggle("is-done", isDone);
    $("#doneLabel").textContent = isDone ? "Stage done" : "Mark stage done";
  }

  // ---- render : counts on the segmented control ----
  function renderCounts() {
    $("#cThings").textContent = STAGES[selected].things.length;
    $("#cPeople").textContent = PEOPLE.length;
    $("#cDocs").textContent = DOCS.length;
  }

  // ---- render : the list for the active tab, scoped to the selected stage ----
  function renderList() {
    const list = $("#list");
    const st = STAGES[selected];

    if (tab === "things") {
      list.innerHTML =
        '<div class="stage-flag"><span class="pin">&#9679;</span> ' + st.label + ' &middot; this stage</div>' +
        st.things.map((t, j) => {
          const key = st.code + "::" + j;
          const isC = checked.has(key);
          return '<div class="row ' + (isC ? 'checked' : '') + '" data-key="' + key + '">' +
            '<button class="check" aria-label="toggle">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
            '</button>' +
            '<div class="r-main">' +
              '<div class="r-title">' + t.title + (t.priv ? lockSvg : '') + '</div>' +
              '<div class="r-meta">' +
                (t.doc ? '<span class="tag doc">document</span>' : '') +
                (t.priv ? '<span class="tag priv">private</span>' : '') +
                '<span>assigned</span>' +
              '</div>' +
            '</div>' +
            avatar(t.assignee) +
          '</div>';
        }).join("");
      list.querySelectorAll(".row").forEach((r) => {
        r.querySelector(".check").addEventListener("click", () => {
          const k = r.dataset.key;
          if (checked.has(k)) checked.delete(k); else checked.add(k);
          renderAll();
        });
      });
    }

    else if (tab === "people") {
      list.innerHTML =
        '<div class="stage-flag"><span class="pin">&#9679;</span> People on this deal</div>' +
        PEOPLE.map((p) =>
          '<div class="prow">' + avatar(p.init, true) +
            '<div class="p-main"><div class="p-name">' + p.name + '</div><div class="p-role">' + p.role + '</div></div>' +
            '<span class="p-side">' + p.side + '</span>' +
          '</div>'
        ).join("");
    }

    else { // documents
      list.innerHTML =
        '<div class="stage-flag"><span class="pin">&#9679;</span> Deal documents</div>' +
        DOCS.map((d) =>
          '<div class="prow">' +
            '<span class="doc-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></span>' +
            '<div class="p-main"><div class="p-name" style="display:flex;align-items:center;gap:7px">' + d.name + (d.priv ? lockSvg : '') + '</div><div class="p-role">' + d.meta + '</div></div>' +
            (d.priv ? '<span class="tag priv">private</span>' : '<span class="tag doc">shared</span>') +
          '</div>'
        ).join("");
    }
  }

  function renderAll() {
    renderDropdown();
    renderDonePill();
    renderCounts();
    renderList();
  }

  // ---- wiring ----
  $("#stageTrigger").addEventListener("click", (e) => {
    e.stopPropagation();
    const sel = $("#stageSelect");
    const open = sel.classList.toggle("open");
    $("#stageTrigger").setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", () => {
    $("#stageSelect").classList.remove("open");
    $("#stageTrigger").setAttribute("aria-expanded", "false");
  });

  $("#donePill").addEventListener("click", () => {
    const code = STAGES[selected].code;
    if (doneStages.has(code)) doneStages.delete(code); else doneStages.add(code);
    renderAll();
  });

  $("#seg").querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      tab = b.dataset.tab;
      $("#seg").querySelectorAll("button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      renderList();
    });
  });

  renderAll();
</script>
</body>
</html>
