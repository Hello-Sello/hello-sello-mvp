<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deal Room - Right Column - Variation Switcher</title>
<style>
  /* ----- Damson tokens (mirrored from src/app/globals.css) ----- */
  :root {
    --brand:        #e30b5d;   /* raspberry  - primary accent */
    --brand-soft:   #ffb7d5;   /* cotton candy - light fills */
    --brand-deep:   #7a1638;   /* damson - deep accent */
    --ink:          #1f2020;
    --ink-muted:    #6b6470;
    --info:         #6c7bd9;   /* periwinkle - secondary */
    --bg-from:      #ffffff;
    --bg-to:        #fff1f7;
    --glass-bg:        rgba(255,255,255,0.62);
    --glass-bg-strong: rgba(255,255,255,0.92);
    --glass-border:    rgba(255,255,255,0.65);
    --glass-shadow:    0 10px 34px -12px color-mix(in srgb, var(--brand-deep) 18%, transparent);
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(60rem 60rem at 10% -12%, rgba(255,183,213,0.55), transparent 60%),
      radial-gradient(46rem 46rem at 108% 6%, rgba(227,11,93,0.10), transparent 55%),
      radial-gradient(40rem 40rem at 92% 96%, rgba(108,123,217,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 14px;
    gap: 12px;
  }

  .glass-strong {
    background: var(--glass-bg-strong);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }

  /* ----- top control bar ----- */
  .bar {
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex: none;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex: none;
  }
  .brand .mark {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--brand-deep);
  }
  .brand .sub {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .tabs {
    display: flex;
    gap: 7px;
    flex: 1;
    flex-wrap: wrap;
  }
  .tab {
    border: 1px solid transparent;
    cursor: pointer;
    background: rgba(31,32,32,0.045);
    border-radius: 12px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 650;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .16s, color .16s, box-shadow .18s, transform .12s, border-color .16s;
  }
  .tab:hover {
    background: rgba(31,32,32,0.08);
    color: var(--ink);
  }
  .tab .num {
    width: 19px; height: 19px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 10.5px;
    font-weight: 800;
    background: rgba(31,32,32,0.10);
    color: var(--ink-muted);
    transition: background .16s, color .16s;
  }
  .tab.active {
    background: linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%);
    color: #fff;
    box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--brand-deep) 70%, transparent);
    transform: translateY(-1px);
    border-color: rgba(255,255,255,0.4);
  }
  .tab.active .num {
    background: rgba(255,255,255,0.92);
    color: var(--brand-deep);
  }

  /* ----- caption line ----- */
  .caption {
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.35;
  }
  .caption .tag {
    flex: none;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--brand-deep);
    background: color-mix(in srgb, var(--brand-soft) 34%, white);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .caption b { color: var(--brand-deep); font-weight: 700; }
  .caption .sep {
    color: color-mix(in srgb, var(--brand) 55%, var(--ink-muted));
    font-weight: 800;
    padding: 0 2px;
  }

  /* ----- the iframe stage ----- */
  .stage-wrap {
    flex: 1;
    min-height: 0;
    border-radius: var(--radius);
    padding: 6px;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 13px;
    background: rgba(255,255,255,0.5);
    display: block;
  }
</style>
</head>
<body>

  <!-- ════ TOP BAR : 5 labelled switch buttons ════ -->
  <header class="bar glass-strong">
    <div class="brand">
      <span class="mark">Deal Room</span>
      <span class="sub">Right column · variations</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <!-- ════ caption for the current variation ════ -->
  <div class="caption glass-strong">
    <span class="tag" id="capTag">V1</span>
    <span id="capText"></span>
  </div>

  <!-- ════ single full-size iframe ════ -->
  <main class="stage-wrap glass-strong">
    <iframe id="frame" title="Deal Room variation"></iframe>
  </main>

<script>
  /* Each variation: the file, a short label, and a one-line caption
     describing its stage-filter + done-box approach. */
  const VARIATIONS = [
    {
      label: "Stage pills",
      src: "v1-stage-pills.html",
      filter: "Horizontal stage pills across the top",
      done: "a dashed “Mark stage done” box beside the active-stage header",
    },
    {
      label: "Accordion",
      src: "v2-accordion-stages.html",
      filter: "Single-open vertical accordion of stage cards",
      done: "a round done toggle on each stage’s header row (marking auto-collapses)",
    },
    {
      label: "Stepper rail",
      src: "v3-stepper-rail.html",
      filter: "Vertical stepper rail pinned to the far right",
      done: "a big done-box (icon + button) in the work-panel header",
    },
    {
      label: "Dropdown",
      src: "v4-dropdown-done.html",
      filter: "Compact dropdown menu picks the stage",
      done: "a prominent “Mark stage done” pill right next to the dropdown",
    },
    {
      label: "Sticky bands",
      src: "sticky-stage-bands.html",
      filter: "Jump chips + sticky stage header bands while you scroll",
      done: "the mark-done pill lives inside each sticky band",
    },
    {
      label: "v6 (superseded)",
      src: "v6-v4-plus-overview.html",
      filter: "V4’s dropdown + an always-visible 5-segment overview rail (per-stage done/total, fill bar, end-stage flag; click to select)",
      done: "the prominent “Mark stage done” pill, softly glowing when all of the stage’s things are ticked (still a manual click)",
    },
    {
      label: "V7 - FINAL - LOCKED (dropdown only)",
      src: "v7-v4-final.html",
      filter: "JUST the dropdown - no overview rail. The overview lives INSIDE the menu: open it to see every stage’s name + done/total + a green check when complete + an “end” tag on the last stage (scales to 10+ stages)",
      done: "the prominent “Mark stage done” pill, glowing only when all of the selected stage’s things are ticked - always a manual click, never auto-completes",
    },
  ];

  const tabsEl = document.getElementById("tabs");
  const frame  = document.getElementById("frame");
  const capTag = document.getElementById("capTag");
  const capText = document.getElementById("capText");

  function select(i) {
    VARIATIONS.forEach((v, idx) => {
      tabsEl.children[idx].classList.toggle("active", idx === i);
    });
    const v = VARIATIONS[i];
    if (frame.getAttribute("src") !== v.src) frame.setAttribute("src", v.src);
    capTag.textContent = "V" + (i + 1);
    capText.innerHTML =
      "<b>Filter:</b> " + v.filter +
      " <span class='sep'>/</span> <b>Done box:</b> " + v.done;
    location.hash = "v" + (i + 1);
  }

  VARIATIONS.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "tab";
    b.innerHTML = '<span class="num">' + (i + 1) + '</span>' + v.label;
    b.onclick = () => select(i);
    tabsEl.appendChild(b);
  });

  /* honour a #v3 style hash on load, else start on the FINAL (recommended) variation */
  const m = (location.hash || "").match(/v(\d)/i);
  const start = m ? Math.min(Math.max(+m[1] - 1, 0), VARIATIONS.length - 1) : VARIATIONS.length - 1;
  select(start);
</script>
</body>
</html>
