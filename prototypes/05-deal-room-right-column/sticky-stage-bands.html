<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deal Room - Right Column - V5 Sticky Stage Bands</title>
<style>
  /* ----- Damson tokens (lifted from src/app/globals.css) ----- */
  :root {
    --brand:        #e30b5d;  /* raspberry  - primary accent */
    --brand-soft:   #ffb7d5;  /* cotton candy - light fills */
    --brand-deep:   #7a1638;  /* damson - deep accent / pressed */
    --info:         #6c7bd9;  /* periwinkle - secondary */
    --info-soft:    #8b8bdc;
    --surface:      #ffffff;
    --ink:          #1f2020;
    --ink-muted:    #6b6470;
    --success:      #34b233;

    --bg-from:      #ffffff;
    --bg-to:        #fff1f7;
    --glass-bg:        rgba(255,255,255,0.62);
    --glass-bg-strong: rgba(255,255,255,0.92);
    --glass-border:    rgba(255,255,255,0.65);
    --glass-shadow:    0 10px 34px -12px color-mix(in srgb, var(--brand-deep) 18%, transparent);

    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 12px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(60rem 60rem at 10% -12%, rgba(255,183,213,0.55), transparent 60%),
      radial-gradient(46rem 46rem at 108% 6%, rgba(227,11,93,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%);
    background-attachment: fixed;
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }
  .glass-strong {
    background: var(--glass-bg-strong);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }

  /* ================= 3-column Deal Room shell ================= */
  .room {
    display: grid;
    grid-template-columns: 84px 1fr 388px;
    gap: 14px;
    height: 100vh;
    padding: 14px;
  }

  /* ---- LEFT: faded thin deal card placeholder ---- */
  .col-card {
    border-radius: var(--r-lg);
    padding: 14px 10px;
    opacity: 0.5;
    filter: grayscale(0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .back-arrow {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--glass-border);
    color: var(--ink-muted);
    cursor: default;
  }
  .card-ghost {
    width: 100%;
    flex: 1;
    border-radius: var(--r-md);
    background: linear-gradient(180deg, rgba(122,22,56,0.10), rgba(255,255,255,0.04));
    border: 1px dashed rgba(122,22,56,0.25);
  }
  .ghost-line { height: 8px; border-radius: 6px; background: rgba(31,32,32,0.10); margin: 12px 8px; }
  .ghost-line.s { width: 60%; }

  /* ---- MIDDLE: faded chat placeholder ---- */
  .col-chat {
    border-radius: var(--r-lg);
    padding: 16px;
    opacity: 0.45;
    filter: grayscale(0.55);
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }
  .chat-topbar {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(31,32,32,0.08);
  }
  .chat-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); }
  .chat-title { height: 10px; width: 130px; border-radius: 6px; background: rgba(31,32,32,0.16); }
  .bubble {
    max-width: 70%;
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(31,32,32,0.06);
  }
  .bubble.me { align-self: flex-end; background: rgba(255,183,213,0.4); }
  .bub-line { height: 7px; border-radius: 5px; background: rgba(31,32,32,0.14); margin: 5px 0; }
  .bub-line.s { width: 50%; }

  /* ================= RIGHT COLUMN (the star) ================= */
  .col-right {
    border-radius: var(--r-lg);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .right-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--glass-border);
  }
  .right-head .eyebrow {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--brand-deep); font-weight: 700; opacity: 0.8;
  }
  .right-head h2 {
    margin: 4px 0 2px; font-size: 18px; font-weight: 650; letter-spacing: -0.01em;
  }
  .right-head .sub { font-size: 12px; color: var(--ink-muted); }

  /* overall progress meter */
  .deal-progress { margin-top: 12px; }
  .deal-progress .meter {
    height: 7px; border-radius: 99px; background: rgba(31,32,32,0.08); overflow: hidden;
  }
  .deal-progress .meter > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--brand-deep), var(--brand));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .deal-progress .meta {
    display: flex; justify-content: space-between; margin-top: 6px;
    font-size: 11px; color: var(--ink-muted);
  }

  /* ---- chip row (jump / filter) ---- */
  .chip-row {
    display: flex; gap: 7px; overflow-x: auto;
    padding: 12px 18px;
    border-bottom: 1px solid var(--glass-border);
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px;
    border-radius: 99px;
    font-size: 12px; font-weight: 550;
    color: var(--ink-muted);
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(31,32,32,0.08);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
    user-select: none;
  }
  .chip:hover { background: rgba(255,255,255,0.85); color: var(--ink); }
  .chip.active {
    color: #fff;
    background: var(--brand-deep);
    border-color: transparent;
    box-shadow: 0 4px 12px -4px rgba(122,22,56,0.5);
  }
  .chip .chip-num {
    font-size: 10px; font-weight: 700;
    width: 16px; height: 16px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(31,32,32,0.10); color: var(--ink-muted);
  }
  .chip.active .chip-num { background: rgba(255,255,255,0.25); color: #fff; }
  .chip.done-chip .chip-num { background: var(--success); color: #fff; }
  .chip.active.done-chip .chip-num { background: rgba(255,255,255,0.3); }

  /* ---- scroll body holding grouped stage bands ---- */
  .scroll-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding-bottom: 28px;
    scroll-behavior: smooth;
  }
  .scroll-body::-webkit-scrollbar { width: 8px; }
  .scroll-body::-webkit-scrollbar-thumb { background: rgba(122,22,56,0.18); border-radius: 99px; }

  .stage-group { }

  /* ===== STICKY STAGE HEADER BAND (the done box lives here) ===== */
  .band {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-top: 1px solid rgba(255,255,255,0.5);
    border-bottom: 1px solid rgba(31,32,32,0.07);
  }
  .band-index {
    flex: 0 0 auto;
    width: 26px; height: 26px; border-radius: 9px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    background: rgba(122,22,56,0.10);
    color: var(--brand-deep);
  }
  .band-main { flex: 1; min-width: 0; }
  .band-title {
    font-size: 13.5px; font-weight: 650; letter-spacing: -0.005em;
    display: flex; align-items: center; gap: 7px;
  }
  .band-title .count {
    font-size: 11px; font-weight: 600; color: var(--ink-muted);
  }
  /* slim progress under the title */
  .band-meter {
    margin-top: 5px; height: 4px; width: 100%;
    border-radius: 99px; background: rgba(31,32,32,0.08); overflow: hidden;
  }
  .band-meter > span {
    display: block; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--brand-deep), var(--brand));
    transition: width 0.35s ease;
  }

  /* ===== THE DONE BOX - star of the design ===== */
  .done-box {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 12px 7px 9px;
    border-radius: 99px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(122,22,56,0.30);
    background: rgba(255,255,255,0.6);
    color: var(--brand-deep);
    transition: all 0.2s cubic-bezier(.2,.8,.2,1);
    user-select: none;
    white-space: nowrap;
  }
  .done-box:hover {
    background: rgba(122,22,56,0.06);
    border-color: rgba(122,22,56,0.5);
    transform: translateY(-1px);
  }
  .done-box .tick {
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1.5px solid var(--brand-deep);
    transition: all 0.2s ease;
  }
  .done-box .tick svg { width: 11px; height: 11px; opacity: 0; transition: opacity 0.15s ease; }

  /* DONE state - filled, calm green-ish success but in brand world */
  .stage-group.is-done .band {
    background: linear-gradient(180deg, rgba(52,178,51,0.10), rgba(255,255,255,0.85));
  }
  .stage-group.is-done .band-index {
    background: var(--success); color: #fff;
  }
  .stage-group.is-done .done-box {
    background: var(--success);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 5px 14px -5px rgba(52,178,51,0.55);
  }
  .stage-group.is-done .done-box .label-do { display: none; }
  .stage-group.is-done .done-box .label-done { display: inline; }
  .stage-group.is-done .done-box .tick {
    border-color: #fff; background: rgba(255,255,255,0.18);
  }
  .stage-group.is-done .done-box .tick svg { opacity: 1; }
  .stage-group.is-done .band-meter > span { background: var(--success); }
  .done-box .label-done { display: none; }

  /* when a stage is done, soften its items a touch */
  .stage-group.is-done .band-body { opacity: 0.62; }

  /* dimmed (filtered-out) stage groups */
  .stage-group.dimmed { display: none; }

  /* ---- band body: things / people / docs ---- */
  .band-body { padding: 12px 18px 18px; }

  .section-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-muted); font-weight: 700;
    margin: 14px 2px 8px;
    display: flex; align-items: center; gap: 7px;
  }
  .section-label:first-child { margin-top: 2px; }
  .section-label .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); opacity: 0.6; }

  /* item card (thing) */
  .item {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(31,32,32,0.06);
    margin-bottom: 7px;
    transition: background 0.15s ease, transform 0.12s ease;
  }
  .item:hover { background: rgba(255,255,255,0.8); }
  .item .check {
    flex: 0 0 auto;
    width: 19px; height: 19px; border-radius: 6px;
    border: 1.5px solid rgba(31,32,32,0.22);
    display: grid; place-items: center; cursor: pointer;
    transition: all 0.15s ease;
  }
  .item .check svg { width: 11px; height: 11px; opacity: 0; }
  .item.checked .check { background: var(--brand); border-color: var(--brand); }
  .item.checked .check svg { opacity: 1; }
  .item.checked .item-title { text-decoration: line-through; color: var(--ink-muted); }
  .item-body { flex: 1; min-width: 0; }
  .item-title { font-size: 13px; font-weight: 540; letter-spacing: -0.005em; }
  .item-sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }

  /* tiny type tag for document_upload etc. */
  .tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 5px;
    background: rgba(108,123,217,0.14); color: var(--info);
    text-transform: uppercase;
  }
  .tag.doc { background: rgba(108,123,217,0.14); color: var(--info); }

  /* assignee avatar (initials) */
  .avatar {
    flex: 0 0 auto;
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff;
    box-shadow: 0 2px 6px -2px rgba(0,0,0,0.3);
  }
  .avatar.ab { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); }
  .avatar.cd { background: linear-gradient(135deg, var(--info), #5563c4); }
  .avatar.ef { background: linear-gradient(135deg, #d98324, #b5651d); }

  /* private lock pill */
  .lock {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 650;
    padding: 3px 8px; border-radius: 99px;
    background: rgba(122,22,56,0.08);
    color: var(--brand-deep);
    border: 1px solid rgba(122,22,56,0.16);
  }
  .lock svg { width: 11px; height: 11px; }

  /* people / document rows live as compact items too */
  .people-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .person-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 11px 6px 6px;
    border-radius: 99px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(31,32,32,0.07);
    font-size: 12px; font-weight: 540;
  }
  .doc-row {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 13px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(31,32,32,0.06);
    margin-bottom: 7px;
  }
  .doc-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; color: var(--info);
    background: rgba(108,123,217,0.12);
    flex: 0 0 auto;
  }
  .doc-icon svg { width: 15px; height: 15px; }
  .doc-meta { flex: 1; min-width: 0; }
  .doc-name { font-size: 12.5px; font-weight: 560; }
  .doc-sub { font-size: 10.5px; color: var(--ink-muted); }

  /* tiny footnote so reviewer understands the interaction */
  .hint {
    text-align: center; font-size: 10.5px; color: var(--ink-muted);
    padding: 10px 18px 4px; opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="room">

    <!-- ===== LEFT: faded deal card placeholder ===== -->
    <aside class="col-card glass">
      <div class="back-arrow" title="Back (placeholder)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div class="card-ghost">
        <div class="ghost-line"></div>
        <div class="ghost-line s"></div>
        <div class="ghost-line"></div>
      </div>
    </aside>

    <!-- ===== MIDDLE: faded chat placeholder ===== -->
    <section class="col-chat glass">
      <div class="chat-topbar">
        <div class="chat-avatar"></div>
        <div class="chat-title"></div>
      </div>
      <div class="bubble"><div class="bub-line"></div><div class="bub-line s"></div></div>
      <div class="bubble me"><div class="bub-line"></div></div>
      <div class="bubble"><div class="bub-line"></div><div class="bub-line s"></div></div>
      <div class="bubble me"><div class="bub-line s"></div></div>
      <div class="bubble"><div class="bub-line"></div></div>
    </section>

    <!-- ===== RIGHT COLUMN (full fidelity) ===== -->
    <section class="col-right glass-strong">

      <!-- header + overall progress -->
      <header class="right-head">
        <div class="eyebrow">Deal Room</div>
        <h2>Stages &amp; work</h2>
        <div class="sub">GreenLeaf &times; StonePharm &middot; 240kg flower</div>

        <div class="deal-progress">
          <div class="meter"><span id="dealMeter" style="width:0%"></span></div>
          <div class="meta">
            <span id="dealCount">0 of 5 stages done</span>
            <span id="dealPct">0%</span>
          </div>
        </div>
      </header>

      <!-- chip row: jump / filter to a stage -->
      <nav class="chip-row" id="chipRow">
        <div class="chip active" data-filter="all">All stages</div>
        <!-- per-stage chips injected by JS -->
      </nav>

      <!-- grouped, sticky-banded body -->
      <div class="scroll-body" id="scrollBody"><!-- stage groups injected by JS --></div>

      <div class="hint">Tap a chip to jump &middot; the sticky band's pill marks the stage done</div>
    </section>
  </div>

<script>
  /* ---------- inline SVG icons ---------- */
  const ICON = {
    check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    checkW: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    lock:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
    doc:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
  };

  /* ---------- sample data ---------- */
  const PEOPLE = {
    AB: { initials: 'AB', name: 'Alice Brenner',  cls: 'ab' },
    CD: { initials: 'CD', name: 'Carl Dietz',     cls: 'cd' },
    EF: { initials: 'EF', name: 'Eva Forsberg',   cls: 'ef' },
  };

  const STAGES = [
    {
      code: 'negotiation', label: 'Negotiation', done: false,
      things: [
        { title: 'Agree unit price',  type: 'task', assignee: 'AB', checked: true,  private: false },
        { title: 'Confirm volume',    type: 'task', assignee: 'CD', checked: false, private: true  },
      ],
      people: ['AB','CD'],
      docs: [],
    },
    {
      code: 'compliance', label: 'Compliance & Quality', done: false,
      things: [
        { title: 'Upload CoA',          type: 'document_upload', assignee: 'EF', checked: false, private: false },
        { title: 'Lab result review',   type: 'task',            assignee: 'CD', checked: false, private: true  },
      ],
      people: ['EF','CD'],
      docs: [
        { name: 'Certificate of Analysis.pdf', sub: 'PDF · 1.2 MB', private: false },
        { name: 'Internal lab notes.pdf',      sub: 'PDF · 340 KB', private: true  },
      ],
    },
    {
      code: 'agreement', label: 'Agreement', done: true,
      things: [
        { title: 'Draft supply contract',  type: 'document_upload', assignee: 'AB', checked: true, private: false },
        { title: 'Counter-sign contract',  type: 'task',            assignee: 'CD', checked: true, private: false },
      ],
      people: ['AB','CD'],
      docs: [
        { name: 'Supply Agreement v3.pdf', sub: 'PDF · 880 KB · signed', private: false },
      ],
    },
    {
      code: 'payment', label: 'Payment', done: false,
      things: [
        { title: 'Issue proforma invoice', type: 'document_upload', assignee: 'AB', checked: false, private: false },
        { title: 'Confirm escrow terms',   type: 'task',            assignee: 'EF', checked: false, private: false },
      ],
      people: ['AB','EF'],
      docs: [],
    },
    {
      code: 'fulfilment', label: 'Fulfilment & Delivery', done: false,
      things: [
        { title: 'Book courier slot',   type: 'task', assignee: 'EF', checked: false, private: false },
        { title: 'Share delivery note', type: 'document_upload', assignee: 'CD', checked: false, private: false },
      ],
      people: ['EF','CD'],
      docs: [],
    },
  ];

  /* ---------- build ---------- */
  const chipRow   = document.getElementById('chipRow');
  const scrollBody= document.getElementById('scrollBody');

  function avatar(code) {
    const p = PEOPLE[code];
    return `<span class="avatar ${p.cls}" title="${p.name}">${p.initials}</span>`;
  }
  function lockPill() {
    return `<span class="lock">${ICON.lock}Private</span>`;
  }

  function thingHTML(t) {
    const sub = [];
    if (t.type === 'document_upload') sub.push('<span class="tag doc">Upload</span>');
    sub.push('assigned to ' + PEOPLE[t.assignee].name);
    return `
      <div class="item ${t.checked ? 'checked' : ''}" data-thing>
        <span class="check">${ICON.checkW}</span>
        <div class="item-body">
          <div class="item-title">${t.title}</div>
          <div class="item-sub">${sub.join(' · ')}</div>
        </div>
        ${t.private ? lockPill() : ''}
        ${avatar(t.assignee)}
      </div>`;
  }

  function docHTML(d) {
    return `
      <div class="doc-row">
        <span class="doc-icon">${ICON.doc}</span>
        <div class="doc-meta">
          <div class="doc-name">${d.name}</div>
          <div class="doc-sub">${d.sub}</div>
        </div>
        ${d.private ? lockPill() : ''}
      </div>`;
  }

  function stageDoneCount(s) {
    const done = s.things.filter(t => t.checked).length;
    return { done, total: s.things.length };
  }

  STAGES.forEach((s, i) => {
    const { done, total } = stageDoneCount(s);

    /* chip */
    const chip = document.createElement('div');
    chip.className = 'chip' + (s.done ? ' done-chip' : '');
    chip.dataset.filter = s.code;
    chip.innerHTML = `<span class="chip-num">${i+1}</span>${s.label}`;
    chipRow.appendChild(chip);

    /* stage group with sticky band */
    const group = document.createElement('div');
    group.className = 'stage-group' + (s.done ? ' is-done' : '');
    group.id = 'group-' + s.code;
    group.dataset.code = s.code;

    const peopleHTML = s.people.map(p =>
      `<span class="person-pill">${avatar(p)}${PEOPLE[p].name}</span>`).join('');

    group.innerHTML = `
      <div class="band">
        <div class="band-index">${i+1}</div>
        <div class="band-main">
          <div class="band-title">${s.label}
            <span class="count" data-count>${done}/${total} done</span>
          </div>
          <div class="band-meter"><span data-bandmeter style="width:${total?Math.round(done/total*100):0}%"></span></div>
        </div>
        <div class="done-box" data-donebox role="button" tabindex="0">
          <span class="tick">${ICON.checkW}</span>
          <span class="label-do">Mark done</span>
          <span class="label-done">Stage done</span>
        </div>
      </div>
      <div class="band-body">
        <div class="section-label"><span class="dot"></span>Things</div>
        ${s.things.map(thingHTML).join('')}

        <div class="section-label"><span class="dot"></span>People</div>
        <div class="people-row">${peopleHTML}</div>

        ${ s.docs.length ? `
          <div class="section-label"><span class="dot"></span>Documents</div>
          ${s.docs.map(docHTML).join('')}
        ` : '' }
      </div>`;
    scrollBody.appendChild(group);
  });

  /* ---------- overall progress ---------- */
  function refreshDealProgress() {
    const total = STAGES.length;
    const done = STAGES.filter(s => s.done).length;
    const pct = Math.round(done/total*100);
    document.getElementById('dealMeter').style.width = pct + '%';
    document.getElementById('dealCount').textContent = `${done} of ${total} stages done`;
    document.getElementById('dealPct').textContent = pct + '%';
  }
  refreshDealProgress();

  /* ---------- per-stage thing tick (updates band count + meter) ---------- */
  function refreshBand(group, code) {
    const s = STAGES.find(x => x.code === code);
    const { done, total } = stageDoneCount(s);
    group.querySelector('[data-count]').textContent = `${done}/${total} done`;
    group.querySelector('[data-bandmeter]').style.width = (total?Math.round(done/total*100):0) + '%';
  }

  scrollBody.addEventListener('click', (e) => {
    /* tick a thing */
    const item = e.target.closest('[data-thing]');
    if (item && e.target.closest('.check')) {
      const group = item.closest('.stage-group');
      const code  = group.dataset.code;
      const s = STAGES.find(x => x.code === code);
      const idx = [...group.querySelectorAll('[data-thing]')].indexOf(item);
      s.things[idx].checked = !s.things[idx].checked;
      item.classList.toggle('checked');
      refreshBand(group, code);
      return;
    }

    /* mark whole stage done */
    const box = e.target.closest('[data-donebox]');
    if (box) {
      const group = box.closest('.stage-group');
      const code  = group.dataset.code;
      const s = STAGES.find(x => x.code === code);
      s.done = !s.done;
      group.classList.toggle('is-done');
      /* sync the chip too */
      const chip = chipRow.querySelector(`.chip[data-filter="${code}"]`);
      chip.classList.toggle('done-chip', s.done);
      refreshDealProgress();
    }
  });

  /* ---------- chip filter / jump ---------- */
  let activeFilter = 'all';
  chipRow.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const filter = chip.dataset.filter;
    chipRow.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = filter;

    if (filter === 'all') {
      document.querySelectorAll('.stage-group').forEach(g => g.classList.remove('dimmed'));
    } else {
      document.querySelectorAll('.stage-group').forEach(g => {
        g.classList.toggle('dimmed', g.dataset.code !== filter);
      });
      /* jump to it */
      const target = document.getElementById('group-' + filter);
      if (target) scrollBody.scrollTo({ top: target.offsetTop - 4, behavior: 'smooth' });
    }
  });
</script>
</body>
</html>
