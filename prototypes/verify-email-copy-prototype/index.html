<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype — Verify-email waiting screen (keep spinner, honest copy)</title>
<!--
  PROTOTYPE — throwaway. Question it answers:
  "What should the post-signup waiting screen say now that the original tab
   does NOT auto-advance?" (onAuthStateChange doesn't fire across tabs.)
  Direction chosen: KEEP the spinner, drop the false 'continues automatically'
  promise. Two wording variants (?v=1 default, ?v=2) switchable via bottom bar.
  Mirrors src/app/(auth)/verify-email/VerifyEmailCard.tsx. Not React on purpose.
-->
<style>
  :root {
    --brand: #E11D63;
    --brand-soft: #FBD5E4;
    --ink: #1B1620;
    --ink-muted: #8A7F87;
    --bg-top: #FFFFFF;
    --bg-bottom: #FCE7F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
    padding: 24px;
    color: var(--ink);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 28px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px -20px rgba(225, 29, 99, 0.25);
  }
  .wordmark {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--brand);
    margin-bottom: 16px;
  }
  .wordmark span { color: var(--brand); }
  .icon {
    width: 48px; height: 48px;
    margin: 0 auto 24px;
    border-radius: 16px;
    background: rgba(251, 213, 228, 0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  h1 { font-size: 18px; font-weight: 600; }
  .sub { margin-top: 8px; font-size: 14px; color: var(--ink-muted); line-height: 1.5; }
  .sub b { color: var(--ink); font-weight: 600; }
  .waiting {
    margin-top: 20px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; color: var(--ink-muted);
  }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--brand-soft);
    border-top-color: var(--brand);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .newtab {
    margin-top: 18px;
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.5;
  }
  .newtab b { color: var(--ink); font-weight: 600; }
  .resend { margin-top: 24px; font-size: 12px; color: var(--ink-muted); }
  .resend a { color: var(--ink); font-weight: 600; text-decoration: underline; cursor: pointer; }

  /* floating variant switcher */
  .bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(27, 22, 32, 0.9); backdrop-filter: blur(10px);
    border-radius: 999px; padding: 6px; display: flex; gap: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .bar button {
    border: 0; background: transparent; color: #fff; opacity: 0.6;
    font-size: 12px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    font-family: inherit;
  }
  .bar button.active { background: var(--brand); opacity: 1; }
  .bar .label { color:#fff; opacity:0.5; font-size:11px; padding:8px 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">He//o Se//o</div>
    <div class="icon">✉️</div>

    <h1>Check your inbox</h1>
    <p class="sub">
      We sent a confirmation link to
      <b>muskan.mv2708@gmail.com</b>. Open it to finish creating your account.
    </p>

    <div class="waiting">
      <span class="spinner"></span>
      <span id="waitText">Waiting for you to open the link…</span>
    </div>

    <p class="newtab" id="newtabText"></p>

    <p class="resend">
      Didn't get it? <a>Resend email</a>
    </p>
  </div>

  <div class="bar">
    <span class="label">copy:</span>
    <button data-v="1">V1 · reassuring</button>
    <button data-v="2">V2 · directive</button>
  </div>

  <script>
    // Two "keep spinner" wordings. Both drop the old false promise
    // ("This page continues automatically once you click the link").
    const VARIANTS = {
      1: {
        wait: 'Waiting for you to open the link…',
        newtab: 'The link opens in a <b>new tab</b> and takes you straight to onboarding. You can safely close this one.',
      },
      2: {
        wait: 'Waiting for confirmation…',
        newtab: 'Opening the link continues in a <b>new tab</b> — this tab can be closed.',
      },
    };
    function render(v) {
      const data = VARIANTS[v] || VARIANTS[1];
      document.getElementById('waitText').textContent = data.wait;
      document.getElementById('newtabText').innerHTML = data.newtab;
      document.querySelectorAll('.bar button').forEach(b =>
        b.classList.toggle('active', b.dataset.v === String(v)));
      const url = new URL(location);
      url.searchParams.set('v', v);
      history.replaceState({}, '', url);
    }
    document.querySelectorAll('.bar button').forEach(b =>
      b.addEventListener('click', () => render(b.dataset.v)));
    render(new URLSearchParams(location.search).get('v') || '1');
  </script>
</body>
</html>
