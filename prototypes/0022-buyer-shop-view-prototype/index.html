<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0022 — Buyer shop view · prototype</title>
<style>
:root{
  --brand:#e30b5d; --brand-soft:#ffb7d5; --brand-deep:#7a1638;
  --surface:#fff; --ink:#1f2020; --ink-muted:#6b6470;
  --success:#34b233; --info:#6c7bd9; --danger:#dc2626;
  --bg-from:#fff; --bg-to:#fff1f7;
  --glass-bg:rgba(255,255,255,.62); --glass-strong:#fff;
  --glass-border:rgba(255,255,255,.65);
  --glass-shadow:0 10px 34px -12px rgba(122,22,56,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); padding-bottom:96px;
  background:
    radial-gradient(60rem 60rem at 10% -12%, rgba(255,183,213,.55), transparent 60%),
    radial-gradient(46rem 46rem at 108% 6%, rgba(227,11,93,.10), transparent 55%),
    linear-gradient(160deg,var(--bg-from) 0%,var(--bg-to) 100%);
  background-attachment:fixed;
}
.glass{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}

/* ---------- fit-check chrome (NOT part of the design) ---------- */
.fitwrap{margin:0 auto;padding:14px 10px 40px}
.fitbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin:0 auto 10px;padding:7px 12px;border-radius:10px;
  background:#1f2020;color:#fff;font:600 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.fitbar b{color:var(--brand-soft)}
.fitbar .warn{color:#ffd0a8}
.fitbar .ok{color:#9ff29e}
.ruler{position:relative;height:16px;margin:0 auto 8px;border-left:2px solid rgba(31,32,32,.35);border-right:2px solid rgba(31,32,32,.35)}
.ruler:before{content:"";position:absolute;top:7px;left:0;right:0;border-top:1px dashed rgba(31,32,32,.35)}
.ruler span{position:absolute;left:50%;top:-3px;transform:translateX(-50%);background:#fff;padding:0 6px;font:600 10px ui-monospace,monospace;color:#555}
.stage{margin:0 auto}

/* ---------- page chrome ---------- */
.banner{position:relative;height:150px;border-radius:20px 20px 0 0;overflow:hidden;
  background:linear-gradient(120deg,#7a1638,#e30b5d 55%,#ffb7d5)}
.banner .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.28))}
.logo{position:absolute;left:20px;bottom:-30px;width:74px;height:74px;border-radius:18px;background:#fff;
  border:3px solid #fff;box-shadow:var(--glass-shadow);display:grid;place-items:center;
  font:800 20px/1 ui-sans-serif;color:var(--brand-deep)}
.idbar{padding:40px 20px 14px;border-radius:0 0 20px 20px;background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-top:0}
.cname{font-size:19px;font-weight:800;letter-spacing:-.2px;margin:0}
.ctag{margin:2px 0 0;color:var(--ink-muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;background:rgba(227,11,93,.10);color:var(--brand-deep)}
.chip.v{background:rgba(52,178,51,.14);color:#1d7a1c}
.chip.state{background:rgba(108,123,217,.15);color:#3c48a0}

.infogrid{display:grid;gap:10px;margin-top:12px}
.infocard{border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.infocard h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-muted)}
.infocard p{margin:0;font-size:12.5px;color:#3c3a3e}
.linkrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
.linkrow a{color:var(--brand);font-weight:700;text-decoration:none}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;padding-bottom:2px}
.tab{white-space:nowrap;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.7);border:1px solid var(--glass-border);color:#4a464c}
.tab.on{background:var(--brand);color:#fff;border-color:transparent}

.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 10px}
.sectionhead h3{margin:0;font-size:15px;font-weight:800}
.count{font-size:11.5px;color:var(--ink-muted);font-weight:700}

/* ---------- grids ---------- */
.grid{display:grid;gap:12px}
.g-wide{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-narrow{grid-template-columns:repeat(1,minmax(0,1fr))}
.g-two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- the REAL card (640px fixed, photo capped 250px) ---------- */
.card{position:relative;height:640px;border-radius:24px;background:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);
  outline:1px solid rgba(255,255,255,.6);display:flex;flex-direction:column;overflow:hidden}
.card .photo{position:relative;aspect-ratio:1/1;max-height:250px;width:100%;flex-shrink:0;
  background:rgba(255,183,213,.4);display:grid;place-items:center;color:rgba(122,22,56,.7);font-weight:700;font-size:13px}
.card .body{display:flex;flex-direction:column;flex:1;min-height:0;padding:12px 14px}
.card h5{margin:0;font-size:15px;font-weight:800;letter-spacing:-.2px}
.card .sub{margin:1px 0 8px;font-size:11.5px;color:var(--ink-muted)}
.specs{flex:1;min-height:0;overflow:auto;border-top:1px dashed rgba(122,22,56,.18);padding-top:7px}
.specrow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:2.5px 0;border-bottom:1px dashed rgba(122,22,56,.10)}
.specrow span:first-child{color:var(--ink-muted)}
.specrow span:last-child{font-weight:700}
.pricerow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-top:9px;margin-top:6px;border-top:1px solid rgba(122,22,56,.14)}
.packs{display:flex;gap:4px;flex-wrap:wrap}
.pack{border-radius:999px;border:1px solid rgba(227,11,93,.3);padding:2px 8px;font-size:10.5px;font-weight:700;color:var(--brand-deep);cursor:pointer;background:#fff}
.pack.on{background:var(--brand);color:#fff;border-color:transparent}
.price{text-align:right}
.price small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-muted);margin-bottom:-2px}
.price s{display:block;font-size:12px;font-weight:700;color:rgba(107,100,112,.7)}
.price b{font-size:17px;font-weight:800;color:var(--brand-deep);font-variant-numeric:tabular-nums}
.price b i{font-size:12px;font-style:normal}
.seeall{display:block;margin-top:1px;font-size:10.5px;font-weight:800;color:var(--brand);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.por{border-radius:999px;background:rgba(227,11,93,.10);padding:6px 12px;font-size:12px;font-weight:800;color:var(--brand-deep)}
.buyrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid rgba(122,22,56,.2);border-radius:999px;padding:2px}
.stepper button{width:26px;height:26px;border-radius:999px;border:0;background:rgba(227,11,93,.10);color:var(--brand-deep);font-weight:800;cursor:pointer}
.stepper span{min-width:30px;text-align:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;flex:1}
.btn.ghost{background:rgba(227,11,93,.10);color:var(--brand-deep);flex:1}
.btn.outline{background:#fff;border:1px solid rgba(227,11,93,.35);color:var(--brand-deep)}
.flipnote{margin-top:8px;font-size:10.5px;color:var(--ink-muted);text-align:center}

/* ladder popover */
.ladder{position:absolute;z-index:40;right:12px;bottom:96px;width:210px;border-radius:12px;border:1px solid rgba(227,11,93,.25);
  background:#fff;padding:6px;box-shadow:0 12px 30px -8px rgba(122,22,56,.4)}
.lrow{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:8px;font-size:11.5px;white-space:nowrap}
.lrow+.lrow{border-top:1px dashed rgba(227,11,93,.2)}
.lrow.applied{background:rgba(227,11,93,.10);font-weight:800}

/* ---------- L0 locked panel ---------- */
.locked{border-radius:20px;padding:26px 20px;text-align:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border:1px dashed rgba(122,22,56,.28);box-shadow:var(--glass-shadow)}
.locked .ic{width:44px;height:44px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;
  background:rgba(227,11,93,.10);font-size:20px}
.locked h4{margin:0 0 5px;font-size:15px;font-weight:800}
.locked p{margin:0 auto 14px;max-width:380px;font-size:12.5px;color:var(--ink-muted)}

/* ---------- basket dock + connect notice ---------- */
.dock{position:fixed;right:18px;bottom:96px;width:300px;border-radius:18px;z-index:60;
  background:#fff;border:1px solid var(--glass-border);box-shadow:0 18px 40px -14px rgba(122,22,56,.45);overflow:hidden}
.dock header{padding:11px 14px;background:rgba(227,11,93,.08);font-size:12.5px;font-weight:800;display:flex;justify-content:space-between}
.dock .lines{padding:8px 14px;font-size:12px}
.dline{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(122,22,56,.12)}
.notice{margin:8px 14px;padding:9px 11px;border-radius:12px;font-size:11.5px;line-height:1.4;
  background:rgba(108,123,217,.10);border:1px solid rgba(108,123,217,.3);color:#33409c}
.notice b{color:#26307a}
.dock .foot{padding:10px 14px 14px}

/* ---------- variant bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:rgba(31,32,32,.94);backdrop-filter:blur(10px);color:#fff}
.bar .grp{display:flex;gap:6px;align-items:center}
.bar label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#b9b5bd;font-weight:800;margin-right:2px}
.bar button{border:0;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:800;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff}
.bar button.on{background:var(--brand)}
.bar .spacer{flex:1}
.bar .hint{font-size:11px;color:#b9b5bd;max-width:340px;line-height:1.35}
.hide{display:none!important}
</style>
</head>
<body>

<div class="fitwrap">
  <div class="fitbar" id="fitbar"></div>
  <div class="ruler" id="ruler"><span id="rulerlabel"></span></div>
  <div class="stage" id="stage"></div>
</div>

<div class="dock hide" id="dock">
  <header><span>Your basket · Canadian Craft</span><span id="dockcount">2 items</span></header>
  <div class="lines">
    <div class="dline"><span>Pink Kush · 10 g × 3</span><b>€ 261,00</b></div>
    <div class="dline" style="border:0"><span>Blue Dream · 5 g × 2</span><b>€ 92,00</b></div>
  </div>
  <div class="notice hide" id="connectnotice">
    <b>You are not connected to Canadian Craft yet.</b><br>
    Sending this order also sends them a <b>connection request</b>. They will see both —
    but they can only open your order after accepting.
  </div>
  <div class="foot"><button class="btn primary" style="width:100%" id="sendbtn">Send order</button></div>
</div>

<div class="bar">
  <div class="grp"><label>Variant</label>
    <button data-v="A" class="on">A · Full shop</button>
    <button data-v="B">B · Narrow column</button>
    <button data-v="C">C · Two-zone</button>
  </div>
  <div class="grp"><label>Buyer</label>
    <button data-c="0" class="on">Not connected</button>
    <button data-c="1">Connected</button>
  </div>
  <div class="grp"><label>Catalogue</label>
    <button data-l="L0" >L0 all hidden</button>
    <button data-l="MIX" class="on">Mixed L1+L2</button>
    <button data-l="L2">L2 all priced</button>
  </div>
  <div class="grp"><label>Basket</label>
    <button data-d="1">Show send</button>
  </div>
  <div class="spacer"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
/* ============================================================
   0022 buyer-shop-view — throwaway prototype.
   Question: the seller's Present shop is built for a 1400px page and a
   fixed 640px card. /discover/[companyId] is max-w-xl (576px). What shape
   does the buyer's shop view actually take inside the REAL container?
   ============================================================ */

const STATE = { v:'A', connected:0, level:'MIX', dock:0 };

/* Real container constraints, read off the source:
   - /discover/[companyId]/page.tsx:33  -> max-w-xl  = 576px, px-2
   - present/ShopView.tsx:722           -> max-w-[1400px], px-6/8
   - catalog/ProductCard.tsx:361        -> h-[640px] fixed
   - ProductCard photo                  -> aspect-square, max-h 250px      */
const CONTAINER = {
  A:{ w:1400, pad:32, grid:'g-wide',   label:'max-w-[1400px] · px-8 — Present’s container' },
  B:{ w:576,  pad:8,  grid:'g-narrow', label:'max-w-xl (576px) · px-2 — Discover’s REAL container today' },
  C:{ w:576,  pad:8,  grid:'g-narrow', label:'max-w-xl header + full-bleed catalogue' }
};

const PRODUCTS = [
  {n:'Pink Kush',   c:'Indica dominant', thc:'24.1', cbd:'0.8', pack:['5 g','10 g','25 g'], price:8.70, tiers:[[500,7.90],[1000,7.20],[2000,6.40]], vis:1, pub:1},
  {n:'Blue Dream',  c:'Sativa dominant', thc:'19.4', cbd:'1.2', pack:['5 g','10 g'],        price:9.20, tiers:[[500,8.40],[1500,7.60]],            vis:1, pub:1},
  {n:'OG Kush',     c:'Hybrid',          thc:'22.0', cbd:'0.5', pack:['10 g','25 g'],       price:null, tiers:[],                                  vis:1, pub:0},
  {n:'White Widow', c:'Hybrid',          thc:'20.8', cbd:'0.9', pack:['5 g'],               price:null, tiers:[],                                  vis:0, pub:0},
  {n:'Amnesia Haze',c:'Sativa',          thc:'21.5', cbd:'0.4', pack:['10 g'],              price:7.95, tiers:[[750,7.10]],                        vis:0, pub:1},
  {n:'Northern Lts',c:'Indica',          thc:'18.2', cbd:'1.6', pack:['5 g','10 g'],        price:8.10, tiers:[],                                  vis:1, pub:1}
];

const eur = n => '€ ' + n.toFixed(2).replace('.',',');

/* Which products this buyer may SEE.
   PRD §4(2): connected OR profile_visible. Connection overrides visibility,
   never price (PRD §4(3) / DECISIONS 2026-08-19). */
function visible(p){ return STATE.connected ? true : !!p.vis; }
/* Level override just for exploring the three catalogue shapes. */
function priced(p){
  if(STATE.level==='L2') return true;
  if(STATE.level==='L0') return false;
  return !!p.pub;
}
function shown(){
  if(STATE.level==='L0' && !STATE.connected) return [];
  return PRODUCTS.filter(visible);
}

function specRows(p){
  return [['Cultivar',p.c],['THC',p.thc+' %'],['CBD',p.cbd+' %'],['Terpenes','2.4 %'],
          ['Cultivator','Canadian Craft'],['Irradiation','Non-irradiated'],
          ['Packaging','Glass jar · resealable'],['Origin','🇨🇦 Canada · BC']]
    .map(r=>`<div class="specrow"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}

function cardHTML(p,i){
  const isPriced = priced(p) && p.price!=null;
  const ladderOpen = STATE._ladder===i;
  const applied = isPriced && p.tiers.length ? p.tiers[0] : null;
  return `
  <div class="card">
    <div class="photo">${p.n}</div>
    <div class="body">
      <h5>${p.n}</h5>
      <div class="sub">${p.c} · Canadian Craft</div>
      <div class="specs">${specRows(p)}</div>
      <div class="pricerow">
        <div class="packs">${p.pack.map((s,k)=>`<span class="pack ${k===0?'on':''}">${s}</span>`).join('')}</div>
        ${ isPriced ? `
          <div class="price">
            <small>Approx.</small>
            ${applied?`<s>${eur(p.price)}</s>`:''}
            <b>${eur(applied?applied[1]:p.price)}<i>/g</i></b>
            ${p.tiers.length?`<button class="seeall" data-ladder="${i}">${ladderOpen?'Hide prices':'See all prices'}</button>`:''}
          </div>` : `<span class="por">Price on request</span>` }
      </div>
      ${ isPriced ? `
        <div class="buyrow">
          <div class="stepper"><button>−</button><span>1</span><button>+</button></div>
          <button class="btn primary" data-add="${i}">Add to basket</button>
        </div>`
      : `
        <div class="buyrow">
          <button class="btn ghost" data-rp="${i}">Request pricing</button>
        </div>
        <div class="flipnote">Asks about <b>${p.n}</b> — the seller answers in chat</div>` }
    </div>
    ${ ladderOpen ? `<div class="ladder">
        <div class="lrow"><span>Base</span><span>${eur(p.price)}/g</span></div>
        ${p.tiers.map((t,k)=>`<div class="lrow ${k===0?'applied':''}"><span>from ${t[0]} g</span><span>${eur(t[1])}/g</span></div>`).join('')}
      </div>` : '' }
  </div>`;
}

function lockedHTML(){
  return `<div class="locked">
    <div class="ic">🔒</div>
    <h4>This catalogue is private</h4>
    <p>Canadian Craft has not published any products publicly. Connect with them to see
       their full shop — connected companies always see the whole catalogue.</p>
    <button class="btn primary" style="padding:10px 22px">Connect with Canadian Craft</button>
  </div>`;
}

function shopChrome(){
  const st = STATE.connected
    ? `<span class="chip state">Connected</span>`
    : `<span class="chip state">Not connected</span>`;
  return `
  <div class="banner"><div class="veil"></div><div class="logo">CC</div></div>
  <div class="idbar">
    <h2 class="cname">Canadian Craft</h2>
    <p class="ctag">Licensed producer · Vancouver, BC</p>
    <div class="chips">
      <span class="chip v">✓ Verified</span>${st}
      <span class="chip">Cultivator</span><span class="chip">Wholesale</span>
      ${STATE.connected?'':'<button class="btn outline" style="padding:3px 12px;font-size:11px">Connect</button>'}
    </div>
  </div>`;
}

function infoBlocks(cols){
  return `<div class="infogrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">
    <div class="infocard"><h4>About</h4><p>Craft indoor cultivation in British Columbia since 2019.
      EU-GMP certified, GACP compliant. Small-batch, hang-dried, hand-trimmed.</p></div>
    <div class="infocard"><h4>Locations</h4><p>Vancouver HQ · Toronto warehouse · Frankfurt (EU bond)</p></div>
    <div class="infocard"><h4>Links</h4>
      <div class="linkrow"><a href="#">Website</a><a href="#">Lab results</a><a href="#">LinkedIn</a></div></div>
  </div>`;
}

function tabsHTML(){
  return `<div class="tabs">
    <div class="tab on">All locations</div><div class="tab">Vancouver</div>
    <div class="tab">Toronto</div><div class="tab">Frankfurt</div>
  </div>`;
}

function catalogueHTML(gridClass){
  const list = shown();
  if(!list.length) return lockedHTML();
  return `
  <div class="sectionhead">
    <h3>Shop</h3>
    <span class="count">${list.length} products${STATE.connected?' · full catalogue (connected)':' · public products only'}</span>
  </div>
  <div class="grid ${gridClass}">${list.map(cardHTML).join('')}</div>`;
}

function render(){
  const c = CONTAINER[STATE.v];
  const stage = document.getElementById('stage');
  const ruler = document.getElementById('ruler');

  ruler.style.width = c.w+'px';
  document.getElementById('rulerlabel').textContent = c.label;

  /* FIT BAR — the honest read of the constraint */
  const list = shown();
  const cardW = STATE.v==='A' ? Math.floor((c.w - c.pad*2 - 12*3)/4)
              : STATE.v==='C' ? Math.floor((1400 - 64 - 12*3)/4)
              : (c.w - c.pad*2);
  const verdict = STATE.v==='B'
    ? `<span class="warn">⚠ card is 640px tall × ${cardW}px wide — one per row, ~4 screens of scroll for 6 products</span>`
    : `<span class="ok">✓ 4-up at ${cardW}px — the width ProductCard was built for</span>`;
  document.getElementById('fitbar').style.width = c.w+'px';
  document.getElementById('fitbar').innerHTML =
    `<b>FIT CHECK</b> container <b>${c.w}px</b> · card height <b>640px</b> (fixed, ProductCard.tsx:361) · ${verdict}`;

  let html = '';
  if(STATE.v==='A'){
    /* A — the page adopts Present's container wholesale */
    html = `<div style="padding:0 ${c.pad}px">
      ${shopChrome()} ${infoBlocks(3)} ${tabsHTML()} ${catalogueHTML('g-wide')}</div>`;
  }
  if(STATE.v==='B'){
    /* B — Discover's real narrow column is kept; cards stack 1-up */
    html = `<div style="padding:0 ${c.pad}px">
      ${shopChrome()} ${infoBlocks(1)} ${tabsHTML()} ${catalogueHTML('g-narrow')}</div>`;
  }
  if(STATE.v==='C'){
    /* C — narrow profile header, catalogue breaks out full-width beneath it */
    html = `<div style="padding:0 ${c.pad}px">${shopChrome()} ${infoBlocks(1)}</div>
      <div style="width:1400px;margin:16px 0 0 -412px;padding:0 32px">
        ${tabsHTML()} ${catalogueHTML('g-wide')}
      </div>`;
  }
  stage.style.width = c.w+'px';
  stage.innerHTML = html;

  /* basket dock */
  const dock = document.getElementById('dock');
  dock.classList.toggle('hide', !STATE.dock);
  document.getElementById('connectnotice').classList.toggle('hide', !!STATE.connected);
  document.getElementById('sendbtn').textContent =
    STATE.connected ? 'Send order' : 'Send order + connection request';

  document.getElementById('hint').textContent =
    STATE.v==='A' ? 'A: /discover widens to Present’s 1400px. Identical shop, one component, zero card rework — but Discover stops looking like Discover.'
  : STATE.v==='B' ? 'B: keeps Discover’s 576px column. Honest to the current page, but a 640px card one-per-row makes browsing 6 products a long scroll.'
  : 'C: profile stays narrow and familiar; the catalogue breaks out wide so ProductCard fits as designed. Two containers on one page.';
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.v){ STATE.v=b.dataset.v; STATE._ladder=null; syncBar('v',b); }
  else if(b.dataset.c!=null){ STATE.connected=+b.dataset.c; syncBar('c',b); }
  else if(b.dataset.l){ STATE.level=b.dataset.l; syncBar('l',b); }
  else if(b.dataset.d){ STATE.dock=!STATE.dock; b.classList.toggle('on',!!STATE.dock); }
  else if(b.dataset.ladder!=null){ const i=+b.dataset.ladder; STATE._ladder = STATE._ladder===i?null:i; }
  else if(b.dataset.add!=null){ STATE.dock=1; document.querySelector('[data-d]').classList.add('on'); }
  else if(b.dataset.rp!=null){ alert('Opens a chat with Canadian Craft about "'+shown()[+b.dataset.rp].n+'".\n\nPRD §4(5): the ask names the product; the seller answers in chat.'); return; }
  else return;
  render();
});
function syncBar(key,btn){
  const attr = {v:'data-v',c:'data-c',l:'data-l'}[key];
  document.querySelectorAll('.bar ['+attr+']').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
}
render();
</script>
</body>
</html>
