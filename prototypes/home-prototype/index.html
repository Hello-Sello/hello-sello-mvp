<!DOCTYPE html>
<!-- PROTOTYPE - throwaway. 3 Home variants, switchable via ?variant=A|B|C. Not production. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Sello - Home (prototype)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style> body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900">
<div id="app"></div>
<div id="switcher"></div>
<script>
const USER = { name: "Sarah", company: "Aurora Cannabis" };
const SURFACES = [
  { key:'discover', name:'Discover', icon:'🔍', desc:'Find buyers & suppliers', active:true },
  { key:'connect',  name:'Connect',  icon:'💬', desc:'Chats & deals',          active:true },
  { key:'present',  name:'Present',   icon:'🏪', desc:'Your shop',              active:true },
  { key:'buy',      name:'Buy',       icon:'🛒', desc:'Source products',        active:false },
  { key:'sell',     name:'Sell',      icon:'🏷️', desc:'List & sell',            active:false },
  { key:'trade',    name:'Trade',     icon:'🔄', desc:'Swap & barter',          active:false },
];

function topbar(){
  return `
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <span class="text-pink-600 font-black text-lg tracking-tight">Hello sello</span>
      <div class="flex items-center gap-4">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-100 rounded-full text-slate-400 text-sm w-64"><span>🔍</span><span>Search companies, deals...</span></div>
        <div class="w-8 h-8 rounded-full bg-pink-100 text-pink-700 flex items-center justify-center font-semibold text-sm">S</div>
      </div>
    </div>
  </header>`;
}

/* ---------- Variant A: Surface hub (grid of 6 tiles) ---------- */
function variantA(){
  return `
  ${topbar()}
  <main class="max-w-6xl mx-auto px-6 py-10">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-slate-900">Good morning, ${USER.name}</h1>
      <p class="text-slate-500">${USER.company} · what would you like to do?</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      ${SURFACES.map(s => s.active ? `
        <a href="#" class="group p-5 bg-white border border-slate-200 rounded-xl hover:border-pink-300 hover:shadow-sm transition-all">
          <div class="text-3xl mb-3">${s.icon}</div>
          <div class="font-semibold text-slate-900">${s.name}</div>
          <div class="text-sm text-slate-500 mt-0.5">${s.desc}</div>
          <div class="mt-3 text-sm text-pink-600 font-medium opacity-0 group-hover:opacity-100 transition-opacity">Open &rarr;</div>
        </a>` : `
        <div class="p-5 bg-slate-50 border border-slate-200 rounded-xl opacity-70">
          <div class="text-3xl mb-3 grayscale">${s.icon}</div>
          <div class="font-semibold text-slate-500">${s.name}</div>
          <div class="text-sm text-slate-400 mt-0.5">${s.desc}</div>
          <div class="mt-3 inline-block text-[11px] font-medium text-slate-500 bg-slate-200 rounded-full px-2 py-0.5">Coming soon</div>
        </div>`).join('')}
    </div>
    <div class="mt-8 flex items-center gap-3 p-4 bg-pink-50 border border-pink-100 rounded-xl">
      <div class="w-9 h-9 rounded-full bg-pink-600 text-white flex items-center justify-center shrink-0">&#10022;</div>
      <div class="flex-1 text-sm text-slate-700"><strong>Sella:</strong> GreenLeaf Pharma's deal is ready to confirm. Want to review it?</div>
      <button class="text-sm px-3 py-1.5 bg-pink-600 text-white rounded-lg hover:bg-pink-700 shrink-0">Review</button>
    </div>
  </main>`;
}

/* ---------- Variant B: Sella-first (chat landing) ---------- */
function variantB(){
  const chips = ['Find a buyer','Open my chats','Set up my shop','See my deals'];
  return `
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
      <span class="text-pink-600 font-black text-lg tracking-tight">Hello sello</span>
      <div class="w-8 h-8 rounded-full bg-pink-100 text-pink-700 flex items-center justify-center font-semibold text-sm">S</div>
    </div>
  </header>
  <main class="max-w-2xl mx-auto px-6 pt-16 pb-10 flex flex-col items-center text-center min-h-[70vh] justify-center">
    <div class="w-16 h-16 rounded-2xl bg-pink-600 text-white flex items-center justify-center text-3xl mb-5">&#10022;</div>
    <h1 class="text-3xl font-bold text-slate-900">Hello ${USER.name}, what are we doing next?</h1>
    <p class="text-slate-500 mt-2">I'm Sella. Tell me what you need, or pick a shortcut.</p>
    <div class="w-full mt-8 flex items-center gap-2 p-2 bg-white border border-slate-300 rounded-2xl shadow-sm">
      <input type="text" placeholder="e.g. find buyers for 10kg this month" class="flex-1 px-3 py-2 outline-none text-slate-700 bg-transparent"/>
      <button class="px-4 py-2 bg-pink-600 text-white rounded-xl hover:bg-pink-700">Ask</button>
    </div>
    <div class="flex flex-wrap gap-2 justify-center mt-5">
      ${chips.map(c=>`<button class="px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-pink-300">${c}</button>`).join('')}
    </div>
    <div class="mt-12 w-full">
      <div class="text-xs uppercase tracking-wide text-slate-400 mb-3">Jump to a surface</div>
      <div class="flex flex-wrap gap-2 justify-center">
        ${SURFACES.map(s=> s.active
          ? `<a href="#" class="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-700 hover:border-pink-300">${s.icon} ${s.name}</a>`
          : `<span class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-400">${s.icon} ${s.name} · soon</span>`).join('')}
      </div>
    </div>
  </main>`;
}

/* ---------- Variant C: Dashboard (sidebar + activity feed) ---------- */
function variantC(){
  const deals=[
    {c:'GreenLeaf Pharma',p:'5kg · €4.20/kg · net 30',s:'Draft',badge:'text-amber-700 bg-amber-50 border-amber-200'},
    {c:'NordMed',p:'12kg · €3.90/kg',s:'Confirmed',badge:'text-emerald-700 bg-emerald-50 border-emerald-200'}
  ];
  const reqs=[{c:'CannaCare GmbH',t:'2h ago'},{c:'BerlinBuds',t:'1d ago'}];
  const chats=[{c:'GreenLeaf Pharma',m:'Can you do net 30?'},{c:'NordMed',m:'Sounds good, sending the PO'}];
  return `
  <div class="flex min-h-screen">
    <aside class="w-56 bg-white border-r border-slate-200 p-4 hidden md:block">
      <div class="text-pink-600 font-black text-lg tracking-tight px-2 mb-6">Hello sello</div>
      <nav class="space-y-1">
        ${SURFACES.map(s=> s.active
          ? `<a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 ${s.key==='connect'?'bg-pink-50 text-pink-700 font-medium':'text-slate-700'}"><span>${s.icon}</span>${s.name}</a>`
          : `<span class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400"><span class="grayscale">${s.icon}</span>${s.name}<span class="ml-auto text-[10px] bg-slate-100 rounded-full px-1.5 py-0.5">soon</span></span>`).join('')}
      </nav>
    </aside>
    <div class="flex-1 bg-slate-50">
      <header class="bg-white border-b border-slate-200 px-6 h-14 flex items-center justify-between">
        <div class="font-semibold text-slate-800">Home</div>
        <div class="w-8 h-8 rounded-full bg-pink-100 text-pink-700 flex items-center justify-center font-semibold text-sm">S</div>
      </header>
      <main class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="lg:col-span-2 space-y-5">
          <div>
            <h1 class="text-xl font-bold text-slate-900">Good morning, ${USER.name}</h1>
            <p class="text-slate-500 text-sm">${USER.company}</p>
          </div>
          <section class="bg-white border border-slate-200 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3"><h2 class="font-semibold text-slate-800">Active deals</h2><a href="#" class="text-sm text-pink-600">View all</a></div>
            <div class="divide-y divide-slate-100">
              ${deals.map(d=>`<div class="py-2.5 flex items-center justify-between"><div><div class="text-sm font-medium text-slate-800">${d.c}</div><div class="text-xs text-slate-500">${d.p}</div></div><span class="text-xs font-medium border rounded-full px-2 py-0.5 ${d.badge}">${d.s}</span></div>`).join('')}
            </div>
          </section>
          <section class="bg-white border border-slate-200 rounded-xl p-4">
            <h2 class="font-semibold text-slate-800 mb-3">Connection requests</h2>
            <div class="divide-y divide-slate-100">
              ${reqs.map(r=>`<div class="py-2.5 flex items-center justify-between"><div class="text-sm text-slate-700">${r.c}</div><div class="flex items-center gap-2"><span class="text-xs text-slate-400">${r.t}</span><button class="text-xs px-2.5 py-1 bg-pink-600 text-white rounded-lg hover:bg-pink-700">Accept</button></div></div>`).join('')}
            </div>
          </section>
        </div>
        <div class="space-y-5">
          <section class="bg-white border border-pink-100 rounded-xl p-4">
            <div class="flex items-center gap-2 mb-3"><div class="w-7 h-7 rounded-full bg-pink-600 text-white flex items-center justify-center text-sm">&#10022;</div><h2 class="font-semibold text-slate-800">Sella</h2></div>
            <div class="space-y-2 text-sm text-slate-600">
              <div class="p-2.5 bg-pink-50 rounded-lg">GreenLeaf's deal is ready to confirm.</div>
              <div class="p-2.5 bg-slate-50 rounded-lg">3 new buyers match your catalog.</div>
            </div>
          </section>
          <section class="bg-white border border-slate-200 rounded-xl p-4">
            <h2 class="font-semibold text-slate-800 mb-3">Recent chats</h2>
            <div class="space-y-3">
              ${chats.map(c=>`<div><div class="text-sm font-medium text-slate-800">${c.c}</div><div class="text-xs text-slate-500 truncate">${c.m}</div></div>`).join('')}
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>`;
}

/* ---------- Variant D: Merged - C sidebar (+ Home) + B Sella-first home ---------- */
function variantD(){
  const deals=[
    {c:'GreenLeaf Pharma',p:'5kg · €4.20/kg · net 30',s:'Draft',badge:'text-amber-700 bg-amber-50 border-amber-200',cta:'Review'},
    {c:'NordMed',p:'12kg · €3.90/kg',s:'Confirmed',badge:'text-emerald-700 bg-emerald-50 border-emerald-200',cta:'Open'}
  ];
  const nav=[
    {name:'Home',icon:'🏠',state:'selected'},
    {name:'Discover',icon:'🔍',state:'active'},
    {name:'Connect',icon:'💬',state:'active'},
    {name:'Present',icon:'🏪',state:'active'},
    {name:'Buy',icon:'🛒',state:'soon'},
    {name:'Sell',icon:'🏷️',state:'soon'},
    {name:'Trade',icon:'🔄',state:'soon'},
  ];
  const navItem = n => {
    if(n.state==='selected') return `<a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-pink-50 text-pink-700 font-medium"><span>${n.icon}</span>${n.name}</a>`;
    if(n.state==='active')   return `<a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-700 hover:bg-slate-100"><span>${n.icon}</span>${n.name}</a>`;
    return `<span class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400"><span class="grayscale">${n.icon}</span>${n.name}<span class="ml-auto text-[10px] bg-slate-100 rounded-full px-1.5 py-0.5">soon</span></span>`;
  };
  return `
  <div class="flex min-h-screen">
    <aside class="w-56 bg-white border-r border-slate-200 p-4 hidden md:block">
      <div class="text-pink-600 font-black text-lg tracking-tight px-2 mb-6">Hello sello</div>
      <nav class="space-y-1">${nav.map(navItem).join('')}</nav>
    </aside>
    <div class="flex-1 bg-slate-50">
      <header class="bg-white border-b border-slate-200 px-6 h-14 flex items-center justify-between">
        <div class="font-semibold text-slate-800">Home</div>
        <div class="flex items-center gap-2 text-sm text-slate-500">${USER.name}<span class="w-8 h-8 rounded-full bg-pink-100 text-pink-700 flex items-center justify-center font-semibold">S</span></div>
      </header>
      <main class="max-w-2xl mx-auto p-6 space-y-7">
        <section class="text-center pt-8">
          <div class="w-16 h-16 rounded-2xl bg-pink-600 text-white flex items-center justify-center text-3xl mx-auto mb-4">&#10022;</div>
          <h1 class="text-2xl font-bold text-slate-900">Good morning, ${USER.name}</h1>
          <p class="text-slate-500">${USER.company}</p>
          <p class="text-slate-700 mt-3">I'm Sella. One of your deals needs attention - want to pick up where you left off?</p>
          <div class="max-w-lg mx-auto mt-5 flex items-center gap-2 p-2 bg-white border border-slate-300 rounded-2xl shadow-sm">
            <input type="text" placeholder="Ask Sella, or tell me what you need..." class="flex-1 px-3 py-2 outline-none text-slate-700 bg-transparent"/>
            <button class="px-4 py-2 bg-pink-600 text-white rounded-xl hover:bg-pink-700">Ask</button>
          </div>
        </section>

        <section>
          <div class="flex items-center justify-between mb-2"><h2 class="font-semibold text-slate-800">Your active deals</h2><a href="#" class="text-sm text-pink-600">View all</a></div>
          <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100">
            ${deals.map(d=>`<div class="p-4 flex items-center justify-between"><div><div class="text-sm font-medium text-slate-800">${d.c}</div><div class="text-xs text-slate-500">${d.p}</div></div><div class="flex items-center gap-3"><span class="text-xs font-medium border rounded-full px-2 py-0.5 ${d.badge}">${d.s}</span><button class="text-sm px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-600 hover:border-pink-300">${d.cta}</button></div></div>`).join('')}
          </div>
        </section>
      </main>
    </div>
  </div>`;
}

/* ---------- Switcher ---------- */
const LABELS={D:'Merged (Sella-led + sidebar)',A:'Surface hub',B:'Sella-first',C:'Dashboard'};
const ORDER=['D','A','B','C'];
const VARIANTS={D:variantD,A:variantA,B:variantB,C:variantC};

function setVariant(v){
  const params=new URLSearchParams(location.search);
  params.set('variant',v);
  history.replaceState(null,'',location.pathname+'?'+params.toString());
  render();
}
function currentVariant(){
  let v=(new URLSearchParams(location.search).get('variant')||'D').toUpperCase();
  return ORDER.includes(v)?v:'D';
}
function switcher(v){
  const i=ORDER.indexOf(v);
  const prev=ORDER[(i-1+ORDER.length)%ORDER.length];
  const next=ORDER[(i+1)%ORDER.length];
  return `
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 bg-slate-900 text-white rounded-full shadow-xl px-2 py-1.5">
    <button data-go="${prev}" class="w-8 h-8 rounded-full hover:bg-slate-700 flex items-center justify-center">&larr;</button>
    <div class="px-3 text-sm font-medium whitespace-nowrap">${v} &mdash; ${LABELS[v]} <span class="text-slate-400">(${i+1}/${ORDER.length})</span></div>
    <button data-go="${next}" class="w-8 h-8 rounded-full hover:bg-slate-700 flex items-center justify-center">&rarr;</button>
  </div>`;
}
function render(){
  const v=currentVariant();
  document.getElementById('app').innerHTML=VARIANTS[v]();
  document.getElementById('switcher').innerHTML=switcher(v);
  document.querySelectorAll('#switcher [data-go]').forEach(b=>b.addEventListener('click',()=>setVariant(b.getAttribute('data-go'))));
}
document.addEventListener('keydown',e=>{
  const el=document.activeElement; const tag=(el&&el.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||(el&&el.isContentEditable)) return;
  const i=ORDER.indexOf(currentVariant());
  if(e.key==='ArrowLeft') setVariant(ORDER[(i-1+ORDER.length)%ORDER.length]);
  if(e.key==='ArrowRight') setVariant(ORDER[(i+1)%ORDER.length]);
});
render();
</script>
</body>
</html>
