<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hello Sello — Database Schema Map</title>
<!--
  Self-rendering viewer. Reads ./SCHEMA.md and renders it (markdown + Mermaid).
  SCHEMA.md is the single source of truth — never edit schema content here.
  Must be SERVED (run the `schema-visual` dev server in .claude/launch.json),
  not opened as a file:// — browsers block local files from reading siblings.
  View at: http://localhost:8011/schema-visual.html
-->
<style>
 :root{--pink:#db2777;--ink:#0f172a;--muted:#64748b;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;}
 *{box-sizing:border-box;}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;}
 .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px;}
 h1{font-size:26px;font-weight:800;} h1 strong{color:var(--pink);}
 h2{font-size:20px;margin-top:34px;border-top:1px solid var(--line);padding-top:22px;}
 table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0;}
 th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;} th{background:#f1f5f9;}
 code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:.9em;}
 blockquote{border-left:3px solid var(--pink);margin:12px 0;padding:4px 14px;background:#fdf2f8;color:#334155;}
 pre.mermaid{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:center;overflow-x:auto;}
 a{color:var(--pink);}
</style>
</head>
<body>
<div class="wrap" id="content">Loading schema…</div>
<script type="module">
 import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
 import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js';
 mermaid.initialize({startOnLoad:false,theme:'base',themeVariables:{
   primaryColor:'#fce7f3',primaryBorderColor:'#db2777',primaryTextColor:'#0f172a',
   lineColor:'#db2777',secondaryColor:'#dbeafe',fontFamily:'-apple-system,Segoe UI,Roboto,sans-serif',fontSize:'14px'}});
 const el = document.getElementById('content');
 try{
   const md = await (await fetch('./SCHEMA.md')).text();
   el.innerHTML = marked.parse(md);
   el.querySelectorAll('code.language-mermaid').forEach(c=>{
     const d=document.createElement('pre'); d.className='mermaid'; d.textContent=c.textContent;
     c.parentElement.replaceWith(d);
   });
   await mermaid.run({querySelector:'.mermaid'});
 }catch(e){ el.innerHTML='<p>This page must be <b>served</b> (run the <code>schema-visual</code> dev server), not opened as a file.</p>'; }
</script>
</body>
</html>
